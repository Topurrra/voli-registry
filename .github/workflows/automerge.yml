name: automerge

# Merge auto-bump PRs by themselves, but only the narrowest, re-verified kind.
#
# The 2026-11-03 supply-chain review counted "bot PRs never merge by
# themselves" as a protection. This keeps the protection for everything except
# one case: a PR from bump.yml in which every file is a new version of a
# package that already exists, identical to the previous version except for
# the version string and the hashes. For those, CI does what the owner's
# review could not: it downloads every URL itself and recomputes every hash.
# Anything else (new packages, other field changes, scoop-sync, skill-sync,
# workflow or tool changes, PRs from people) still waits for the owner.
#
# Report-only until the repo variable AUTOMERGE_ENABLED is "true".
#
# Rules (tools/automerge_gate.py has the code and tests):
#   * author app/github-actions, branch auto-bump/*, not a fork, base main,
#     every commit by voli-registry-ci, no `hold` label, open >= 24 h;
#   * only added manifests/<x>/<name>/<new>.toml beside an older version;
#   * new == previous with old version -> new version, hashes excepted; same
#     URL host, https only, same source blocks, bins, env, depends, ...;
#   * voli-index-tool validate + the reserved-shim gate pass;
#   * every sha256/sha512 is reproduced from a fresh download;
#   * the merge is pinned to the verified head commit (--match-head-commit).
#
# The tool code that decides comes from main, never from the PR branch, and
# nothing from the PR branch is executed: manifests are data.
on:
  schedule:
    - cron: "17 */6 * * *" # every 6 h; the 24 h cool-down is the real clock
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to evaluate (blank: every open PR)"
        required: false
        default: ""

permissions: {}

concurrency:
  group: automerge
  cancel-in-progress: false

env:
  COOLDOWN_HOURS: "24"
  # voli v0.14.0. A commit, not the tag: tags can be moved.
  VOLI_REV: 883a388e09c6b997dc0c1249d83074d2807850a7

jobs:
  candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      prs: ${{ steps.list.outputs.prs }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: List PRs that may auto-merge
        id: list
        env:
          GH_TOKEN: ${{ github.token }}
          PR_INPUT: ${{ inputs.pr }}
        run: |
          python tools/automerge_gate.py candidates \
            --repo "$GITHUB_REPOSITORY" --pr "$PR_INPUT" \
            --cooldown-hours "$COOLDOWN_HOURS" >> "$GITHUB_OUTPUT"

  gate:
    needs: candidates
    if: needs.candidates.outputs.prs != '[]' && needs.candidates.outputs.prs != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Read-only: this job reads PR data and downloads vendor files.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        c: ${{ fromJSON(needs.candidates.outputs.prs) }}
    steps:
      - name: Trusted tools (main)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          path: trusted
          persist-credentials: false

      - name: The PR's exact head commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ matrix.c.sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Classify the change
        working-directory: pr
        env:
          PR: ${{ matrix.c.pr }}
        run: |
          python ../trusted/tools/automerge_gate.py classify --base origin/main --out ../gate.json
          python -c "import json,sys; sys.exit(0 if json.load(open('../gate.json'))['eligible'] else 1)" \
            || { echo "::notice::PR #$PR needs the owner (see the job summary)"; exit 1; }

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      # No cache: a cache key shared with another workflow could hand this
      # job a tampered build.
      - name: Install voli-index-tool
        run: |
          cargo install --force --locked \
            --git https://github.com/Topurrra/voli \
            --rev "$VOLI_REV" \
            voli-index-tool

      - name: Validate (same checks as validate.yml)
        working-directory: pr
        run: |
          voli-index-tool validate manifests/
          python ../trusted/tools/check_reserved_shims.py --base origin/main --manifests manifests/

      - name: Re-download every file and recompute its hash
        run: python trusted/tools/automerge_gate.py rehash gate.json

      - name: Record the verdict
        env:
          PR: ${{ matrix.c.pr }}
          SHA: ${{ matrix.c.sha }}
        run: |
          mkdir verdict
          printf '{"pr": %s, "sha": "%s"}\n' "$PR" "$SHA" > "verdict/$PR.json"

      # Present only when every step above passed for this PR.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verdict-${{ matrix.c.pr }}
          path: verdict/
          retention-days: 7

  # Report-only until the owner turns it on:
  #   gh variable set AUTOMERGE_ENABLED -R Topurrra/voli-registry --body true
  # Until then the gate still runs and its summary says what WOULD merge.
  merge:
    needs: [candidates, gate]
    if: >-
      always() && vars.AUTOMERGE_ENABLED == 'true' &&
      needs.candidates.outputs.prs != '[]' && needs.candidates.outputs.prs != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # merge
      pull-requests: write # merge
      statuses: write # report `validate` on the verified commit
      actions: write # start publish.yml (a GITHUB_TOKEN merge does not)
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: verdict-*
          path: verdicts
          merge-multiple: true

      - name: Merge the verified PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          merged=0
          for f in verdicts/*.json; do
            pr=$(jq -r .pr "$f"); sha=$(jq -r .sha "$f")
            [[ "$pr" =~ ^[0-9]+$ && "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::bad verdict $f"; exit 1; }
            # The checks this run performed, reported on the exact commit, so
            # a ruleset that requires `validate` sees them.
            gh api "repos/$GITHUB_REPOSITORY/statuses/$sha" \
              -f state=success -f context=validate \
              -f description="validate + rehash passed in automerge run $GITHUB_RUN_ID" \
              -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
            # --match-head-commit: if anything was pushed after verification,
            # GitHub refuses the merge.
            # A merge commit (like every merge in this repo's history) keeps the
            # verified commit itself in main; a squash would rewrite it.
            if gh pr merge "$pr" -R "$GITHUB_REPOSITORY" --merge --delete-branch \
                 --match-head-commit "$sha"; then
              echo "merged #$pr at $sha" | tee -a "$GITHUB_STEP_SUMMARY"
              merged=$((merged + 1))
            else
              echo "::warning::#$pr did not merge (head moved or merge blocked); left for the owner"
            fi
          done
          echo "merged=$merged" >> "$GITHUB_ENV"

      - name: Publish the index
        if: env.merged != '0' && env.merged != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml -R "$GITHUB_REPOSITORY" --ref main
