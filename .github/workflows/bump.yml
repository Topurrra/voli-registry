name: bump

# Daily auto-bump: check GitHub releases for packages with [autoupdate]
# and open a PR with any new versions found.
on:
  schedule:
    - cron: "0 6 * * *" # daily 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-voli-index-tool-${{ runner.os }}

      - name: Install voli-index-tool
        run: cargo install --force --git https://github.com/Topurrra/voli voli-index-tool --locked

      - name: Run bump
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: voli-index-tool bump manifests/ --limit 20 | tee bump-summary.txt

      - name: Create PR if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain manifests/)" ]; then
            echo "No changes — nothing to bump."
            exit 0
          fi
          DATE=$(date +%Y-%m-%d)
          BRANCH="auto-bump/${DATE}"
          git config user.name "voli-registry-ci"
          git config user.email "ci@volibear.dev"
          git checkout -b "$BRANCH"
          git add manifests/
          git commit -m "bump: auto-update ${DATE}"
          git push -u origin "$BRANCH"

          BODY="Auto-bump (${DATE}).

          \`\`\`
          $(cat bump-summary.txt)
          \`\`\`

          Auto-generated by bump workflow. Validate gate runs on merge."

          gh pr create \
            --title "bump: auto-update ${DATE}" \
            --body "$BODY" \
            --base main \
            --head "$BRANCH"
