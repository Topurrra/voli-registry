name: bump

# Daily auto-bump: check supported release endpoints for packages with [autoupdate]
# and open a PR with any new versions found.
on:
  schedule:
    - cron: "0 6 * * *" # daily 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install Rust
        # Pinned: `stable` is a BRANCH ref, not an immutable tag.
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-voli-index-tool-${{ runner.os }}

      # Pinned to a commit: an unpinned --git install runs voli@main HEAD.
      # Must understand [source.linux-*]/[source.macos-*] (voli v0.13.2+) —
      # the old tool errors on unix manifests at parse time.
      - name: Install voli-index-tool
        run: |
          cargo install --force --locked \
            --git https://github.com/Topurrra/voli \
            --tag v0.13.2 \
            voli-index-tool

      - name: Clone voli for brew-import
        run: git clone --depth 1 --branch v0.13.2 https://github.com/Topurrra/voli ../voli

      - name: Build brew-import
        working-directory: tools/brew-import
        run: cargo build --release --locked

      - name: Run bump
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: voli-index-tool bump manifests/ --limit 20 | tee bump-summary.txt

      # Windows generation may omit or carry forward old Unix blocks. Resolve
      # only the changed allowlisted packages, at their exact registry version.
      - name: Enrich changed packages with exact-version Unix sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/enrich-changed-packages.py

      - name: Validate
        run: voli-index-tool validate manifests/

      # Supply-chain review item 4: the bump trusts whatever the vendor serves
      # today. This report makes the review PR readable: per changed package
      # it lists the download host, flags a HOST CHANGE from the previous
      # version in bold, and records whether the vendor's own checksum matched
      # (or that none was published, in bold). A vendor checksum MISMATCH
      # fails here — the PR is not opened at all.
      - name: Generate vendor provenance report
        run: |
          git fetch --quiet origin main
          python tools/bump_pr_report.py --base origin/main --manifests manifests/ --out pr-report.md

      - name: Create PR if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain manifests/)" ]; then
            echo "No changes — nothing to bump."
            exit 0
          fi
          DATE=$(date +%Y-%m-%d)
          BRANCH="auto-bump/${DATE}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "voli-registry-ci"
          git config user.email "ci@volibear.dev"
          git checkout -b "$BRANCH"
          git add manifests/
          git commit -m "bump: auto-update ${DATE}"
          git push -u origin "$BRANCH"

          LC_ALL=C awk '
            BEGIN { bytes = 0 }
            {
              if (bytes + length($0 ORS) > 50000) exit
              print
              bytes += length($0 ORS)
            }
          ' bump-summary.txt > pr-summary.txt

          {
            echo "Auto-bump (${DATE})."
            echo
            echo '```'
            cat pr-summary.txt
            echo '```'
            if [ "$(wc -c < pr-summary.txt)" -lt "$(wc -c < bump-summary.txt)" ]; then
              echo
              echo "Summary truncated to fit GitHub's PR body limit. Full output is available in the workflow run:"
              echo "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            fi
            echo
            echo "Auto-generated by bump workflow. Validate gate runs on merge."
            echo
            cat pr-report.md
          } > pr-body.md

          gh pr create \
            --title "bump: auto-update ${DATE}" \
            --body-file pr-body.md \
            --base main \
            --head "$BRANCH"
