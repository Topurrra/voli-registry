name: publish

# On merge to main: recompile the signed index and publish the triple
# (index.sqlite.zst, index.sig, index.json) to the `index` release tag, always
# replacing the assets in place so the client's index_url is stable.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "manifests/**"
      - ".github/workflows/publish.yml"

permissions:
  contents: write # required to create/update the release and its assets

concurrency:
  group: publish-index
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        # Pinned: `stable` is a BRANCH ref, so the tag would otherwise run
        # whatever that branch points at today.
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-voli-index-tool-${{ runner.os }}

      # NOTE: same source install as validate.yml. Swap for a prebuilt
      # release-binary download once the main repo publishes them.
      #
      # PINNED TO A COMMIT, and it must stay pinned. The next step runs this
      # binary in a step that holds VOLI_INDEX_SIGNING_KEY. Installing from a
      # branch ref would mean anyone who can land a commit on voli@main gets
      # code execution next to the production signing key. Bump this SHA
      # deliberately, as a reviewed change.
      - name: Install voli-index-tool
        run: |
          cargo install --force --locked \
            --git https://github.com/Topurrra/voli \
            --rev 1ccb4c3c06aace311ea2d13b952d70703cb02a0a \
            voli-index-tool

      # Gate the publish on the skill archives actually being downloadable.
      # Scoped to manifests/skills/ ONLY, deliberately: those URLs are assets on
      # this repo's own `skills` release, uploaded by skill-sync before the
      # manifests can merge, so a non-2xx here is a real and actionable bug. The
      # ~2,700 app manifests point at third-party vendor URLs that are routinely
      # flaky, rate-limited, 403 to datacentre IPs, or behind redirects — gating
      # the publish on those would make it a coin flip, so they are not checked.
      - name: Preflight skill archive URLs
        run: |
          grep -rhoE '^url = "[^"]+"' manifests/skills/ \
            | sed 's/^url = "//; s/"$//' | sort -u > skill-urls.txt
          echo "checking $(wc -l < skill-urls.txt) skill archive URL(s)"
          failed=0
          while read -r url; do
            code=$(curl -sSIL -o /dev/null -w '%{http_code}' \
              --retry 3 --retry-delay 2 --max-time 60 "$url" || echo 000)
            case "$code" in
              2*) ;;
              *) echo "::error::HTTP $code for $url"; failed=1 ;;
            esac
          done < skill-urls.txt
          if [ "$failed" -ne 0 ]; then
            echo "Skill archives are missing from the release. Upload them to the" \
                 "\`skills\` release (skill-sync does this automatically) before merging."
            exit 1
          fi

      - name: Build signed index
        env:
          # Ed25519 signing key (hex). Stored as a GitHub Actions secret.
          # This is the production key; the rotation away from the main repo's
          # registry-dev/dev-signing-key.hex is done and the key is held safely.
          VOLI_INDEX_SIGNING_KEY: ${{ secrets.VOLI_INDEX_SIGNING_KEY }}
        run: |
          printf '%s' "$VOLI_INDEX_SIGNING_KEY" > signing-key.hex
          voli-index-tool build manifests/ --out dist/ --key signing-key.hex
          rm -f signing-key.hex

      # The client (voli-core index::net) fetches, from the release's asset URL:
      #   <index_url>/index.json
      #   <index_url>/index.sqlite.zst
      #   <index_url>/index.sig
      # where index_url = .../releases/download/index. Uploading these three as
      # assets on tag `index` produces exactly those URLs. index.sqlite (the
      # uncompressed db) is intentionally NOT uploaded — the client never fetches it.
      - name: Publish to the `index` release
        # Pinned by SHA: this step runs in the job that holds the signing key.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: index
          name: Package index
          body: "Latest signed Voli package index. Auto-published from main."
          files: |
            dist/index.sqlite.zst
            dist/index.sig
            dist/index.json
            dist/packages.json

      # Also commit packages.json to the repo: the website fetches it via
      # raw.githubusercontent.com because GitHub's release-asset endpoint sends
      # no CORS headers (verified 2026-07-24). Root path is outside this
      # workflow's `paths` filter, so this commit cannot retrigger publish.
      - name: Commit packages.json for the website
        run: |
          cp dist/packages.json packages.json
          if ! git diff --quiet -- packages.json 2>/dev/null || [ -n "$(git status --porcelain packages.json)" ]; then
            git config user.name "voli-registry-ci"
            git config user.email "ci@volibear.dev"
            git add packages.json
            git commit -m "ci: refresh packages.json"
            git push
          fi
