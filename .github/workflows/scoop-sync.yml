name: scoop-sync

# Weekly re-import from ScoopInstaller/Main and Extras.
# New version files are added, same-version files are refreshed
# (URL/hash corrections), existing old versions are NEVER deleted.
on:
  schedule:
    - cron: "0 5 * * 1" # Monday 05:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: scoop-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        # Pinned: `stable` is a BRANCH ref, not an immutable tag.
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-scoop-sync-${{ runner.os }}

      - name: Clone upstream sources
        run: |
          git clone --depth 1 https://github.com/ScoopInstaller/Main /tmp/scoop-main
          git clone --depth 1 https://github.com/ScoopInstaller/Extras /tmp/scoop-extras
          git clone --depth 1 --branch v0.5.7 https://github.com/Topurrra/voli ../voli

      - name: Build scoop-import
        working-directory: tools/scoop-import
        run: cargo build --release --locked

      - name: Run importer
        run: |
          tools/scoop-import/target/release/scoop-import /tmp/scoop-main manifests/
          tools/scoop-import/target/release/scoop-import /tmp/scoop-extras manifests/

      # Pinned to a commit: an unpinned --git install runs voli@main HEAD.
      - name: Install voli-index-tool
        run: |
          cargo install --force --locked \
            --git https://github.com/Topurrra/voli \
            --rev 073d3d9db88dc4d4a4f301cc5215100f7623ce38 \
            voli-index-tool

      - name: Validate
        run: voli-index-tool validate manifests/

      - name: Summarize changes
        id: summary
        run: |
          NEW_FILES=$(git ls-files --others --exclude-standard manifests/ | grep -c '\.toml$' || true)
          MODIFIED_FILES=$(git diff --name-only manifests/ | grep -c '\.toml$' || true)
          MODIFIED_LIST=$(git diff --name-only manifests/ | grep '\.toml$' | head -50 || true)
          echo "new=$NEW_FILES" >> "$GITHUB_OUTPUT"
          echo "modified=$MODIFIED_FILES" >> "$GITHUB_OUTPUT"
          {
            echo "modified_list<<EOF"
            echo "$MODIFIED_LIST"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create PR if changed
        if: steps.summary.outputs.new != '0' || steps.summary.outputs.modified != '0'
        # `modified_list` is built from upstream filenames, so it must never be
        # interpolated into the shell — a crafted Scoop manifest name would run
        # as code. Read it through the environment and write the body to a file,
        # same pattern as bump.yml.
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_COUNT: ${{ steps.summary.outputs.new }}
          MODIFIED_COUNT: ${{ steps.summary.outputs.modified }}
          MODIFIED_LIST: ${{ steps.summary.outputs.modified_list }}
        shell: bash
        run: |
          DATE=$(date +%Y-%m-%d)
          # Include the run id: a second dispatch on the same day would otherwise
          # collide with the existing branch at push/PR-create time.
          BRANCH="scoop-sync/${DATE}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "voli-registry-ci"
          git config user.email "ci@volibear.dev"
          git checkout -b "$BRANCH"
          git add manifests/
          git commit -m "sync: Scoop bucket import ${DATE}"
          git push -u origin "$BRANCH"

          {
            echo "Weekly Scoop Main and Extras sync (${DATE})."
            echo
            echo "- **${NEW_COUNT}** new version file(s)"
            echo "- **${MODIFIED_COUNT}** modified existing file(s)"
            echo
            echo "### Modified existing files (review: Scoop corrected a URL/hash)"
            echo
            echo '```'
            printf '%s\n' "$MODIFIED_LIST"
            echo '```'
            echo
            echo "Auto-generated by scoop-sync workflow. Validate gate runs on merge."
          } > pr-body.md

          gh pr create \
            --title "sync: Scoop import ${DATE}" \
            --body-file pr-body.md \
            --base main \
            --head "$BRANCH"
