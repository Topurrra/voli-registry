name: skill-sync

on:
  schedule:
    - cron: "0 6 * * 2"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: skill-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test importer
        run: python tools/skill-import.py --self-test

      - name: Refresh pinned revisions
        run: python tools/skill-import.py --refresh-pins

      - name: Import skills
        run: |
          python tools/skill-import.py \
            --checkouts /tmp/skill-sources \
            --manifests manifests \
            --assets /tmp/skill-assets \
            --report skill-import-report.md

      - name: Install Rust
        # Pinned: `stable` is a BRANCH ref, not an immutable tag.
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-skill-sync-${{ runner.os }}

      # Pinned to a commit for the same reason as publish.yml: an unpinned
      # --git install builds and runs whatever is on voli@main right now.
      - name: Install voli-index-tool
        run: |
          cargo install --force --locked \
            --git https://github.com/Topurrra/voli \
            --tag v0.10.1 \
            voli-index-tool

      # The Python importer above emits its own TOML. Normalizing it here means
      # it never has to know the canonical shape -- and since validate now fails
      # on drift, this is what keeps that from becoming a broken sync.
      - name: Format manifests
        run: voli-index-tool fmt manifests/ --write

      - name: Validate manifests
        run: voli-index-tool validate manifests/

      - name: Upload generated archives
        uses: actions/upload-artifact@v4
        with:
          name: skill-archives-${{ github.run_id }}
          path: |
            /tmp/skill-assets/*.zip
            skill-import-report.md
          if-no-files-found: error
          retention-days: 14

      # Publish the archives BEFORE the PR exists, so a manifest can never reach
      # main ahead of the asset it points at. An archive's filename embeds its
      # source id and version, so a given name always has the same bytes: the
      # upload is idempotent and --clobber only ever rewrites a file with itself.
      # (The 14-day artifact above is for reviewers; it is not a download source.
      # This step retires the manual dist/skills/UPLOAD.md runbook.)
      - name: Publish archives to the `skills` release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload skills /tmp/skill-assets/*.zip --clobber

      - name: Check for catalog changes
        id: changes
        shell: bash
        run: |
          if [ -n "$(git status --porcelain -- skill-sources.toml manifests/skills skill-import-report.md)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create review PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          DATE=$(date -u +%Y-%m-%d)
          BRANCH="skill-sync/${DATE}-${GITHUB_RUN_ID}"
          git config user.name "voli-registry-ci"
          git config user.email "ci@volibear.dev"
          git checkout -b "$BRANCH"
          git add skill-sources.toml manifests/skills skill-import-report.md
          git commit -m "sync: Tier-1 skill catalog ${DATE}"
          git push -u origin "$BRANCH"
          gh pr create \
            --title "sync: Tier-1 skill catalog ${DATE}" \
            --body "Pinned Tier-1 skill catalog refresh. Generated archives are attached to workflow run ${GITHUB_RUN_ID} for review. Publishing and merging are deferred." \
            --base main \
            --head "$BRANCH"
