name: tools

# The import tooling had no CI of its own: a PR could break skill-import.py or
# scoop-import and only find out during the weekly sync. Runs both test suites
# on any PR that touches tools/.
on:
  pull_request:
    paths:
      - "tools/**"
      - "manifests/**"
      - ".github/workflows/tools.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test skill importer
        run: python tools/skill-import.py --self-test

      - name: Install Rust
        # Pinned: `stable` is a BRANCH ref, not an immutable tag.
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/scoop-import/target
          key: cargo-tools-tests-${{ runner.os }}-${{ hashFiles('tools/scoop-import/Cargo.lock') }}

      # scoop-import has a path dependency on voli-core at ../../../voli, so the
      # tag below must be the exact voli version recorded in the checked-in
      # tools/scoop-import/Cargo.lock or `--locked` fails on a version mismatch.
      # Bumping one without the other is the failure mode: run
      # `cargo update -p voli-core` against a matching checkout and commit the
      # lock in the same change. Every voli pin in this repo's workflows moves
      # together — grep for the tag before changing it.
      - name: Clone voli for the voli-core path dependency
        run: git clone --depth 1 --branch v0.10.1 https://github.com/Topurrra/voli ../voli

      - name: Test scoop-import
        working-directory: tools/scoop-import
        run: cargo test --locked

  test-brew-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache brew-import cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/brew-import/target
          key: cargo-tools-tests-${{ runner.os }}-${{ hashFiles('tools/brew-import/Cargo.lock') }}

      # brew-import's voli-core path dependency (tools/brew-import/../../../voli,
      # i.e. a sibling of this checkout) must understand
      # [source.linux-*]/[source.macos-*]. PLACEHOLDER TAG: set VOLI_TAG to the
      # first voli tag carrying the unix manifest schema (shipped with the
      # linux/mac port), then re-run `cargo update -p voli-core` inside
      # tools/brew-import against a matching checkout and commit the lock in
      # the same change — same discipline as the scoop-import pin above.
      # Every VOLI_TAG in this file moves together — grep for it.
      - name: Clone voli for the voli-core path dependency
        env:
          VOLI_TAG: v0.13.0
        run: git clone --depth 1 --branch "$VOLI_TAG" https://github.com/Topurrra/voli "$GITHUB_WORKSPACE/../voli"

      - name: Test brew-import
        working-directory: tools/brew-import
        run: cargo test --locked

  # Prove every emitted unix block executes somewhere: ubuntu legs gate the
  # linux payloads, macos legs the mac ones. Read-only (`--verify-only`
  # downloads and gates, writes nothing). Runs when the importer, its
  # allowlist, or any manifest changes.
  verify-unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Clone voli for the voli-core path dependency
        # Same PLACEHOLDER TAG as above — keep the two in sync (grep VOLI_TAG).
        env:
          VOLI_TAG: v0.13.0
        run: git clone --depth 1 --branch "$VOLI_TAG" https://github.com/Topurrra/voli "$GITHUB_WORKSPACE/../voli"

      - name: Verify unix payloads from brew-sources.toml
        working-directory: tools/brew-import
        run: |
          names=$(python3 -c "
          import tomllib
          with open('../brew-sources.toml','rb') as f:
              print(' '.join(s['name'] for s in tomllib.load(f)['source']))
          ")
          cargo run --locked -- --verify-only --sources ../brew-sources.toml --manifests ../../manifests $names
