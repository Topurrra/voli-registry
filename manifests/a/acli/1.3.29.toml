name = "acli"
version = "1.3.29"
description = "Software to interact with Atlassian Cloud from the terminal"
homepage = "https://developer.atlassian.com/cloud/acli/"
license = "Proprietary"
kind = "app"
bin = ["acli.exe"]

[source.x64]
url = "https://acli.atlassian.com/windows/1.3.29-stable/acli_1.3.29-stable_windows_amd64.zip"
sha256 = "f05cd696e17043806b6703100db7159881497a9fa4ad433fb8de2b8afb321c18"
extract_dir = "acli_1.3.29-stable_windows_amd64"

[source.arm64]
url = "https://acli.atlassian.com/windows/1.3.29-stable/acli_1.3.29-stable_windows_arm64.zip"
sha256 = "021e25b755c69e79aeae66b57efcd8c972df253855da7a0e6d32559f665f568a"
extract_dir = "acli_1.3.29-stable_windows_arm64"

[autoupdate]
checkver = { url = "https://raw.githubusercontent.com/atlassian/homebrew-acli/main/Formula/acli.rb", regex = "version \"([\\d.]+)-stable\"" }
url_template = { x64 = "https://acli.atlassian.com/windows/$version-stable/acli_$version-stable_windows_amd64.zip", arm64 = "https://acli.atlassian.com/windows/$version-stable/acli_$version-stable_windows_arm64.zip" }
