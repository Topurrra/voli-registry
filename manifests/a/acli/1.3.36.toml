name = "acli"
version = "1.3.36"
description = "Software to interact with Atlassian Cloud from the terminal"
homepage = "https://developer.atlassian.com/cloud/acli/"
license = "Proprietary"
kind = "app"
bin = ["acli.exe"]

[source.x64]
url = "https://acli.atlassian.com/windows/1.3.36-stable/acli_1.3.36-stable_windows_amd64.zip"
sha256 = "a7454d84af6b83a192e98c337c08a0c00ef0450e2485100cebb20b3672095ca3"
extract_dir = "acli_1.3.30-stable_windows_amd64"

[source.arm64]
url = "https://acli.atlassian.com/windows/1.3.36-stable/acli_1.3.36-stable_windows_arm64.zip"
sha256 = "6ae0ca13fa55167ae16c6f70eba276cd656faac4538898b5c38aea39831d8aeb"
extract_dir = "acli_1.3.30-stable_windows_arm64"

[autoupdate]
checkver = { url = "https://raw.githubusercontent.com/atlassian/homebrew-acli/main/Formula/acli.rb", regex = "version \"([\\d.]+)-stable\"" }
url_template = { x64 = "https://acli.atlassian.com/windows/$version-stable/acli_$version-stable_windows_amd64.zip", arm64 = "https://acli.atlassian.com/windows/$version-stable/acli_$version-stable_windows_arm64.zip" }
