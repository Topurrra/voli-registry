name = "acli"
version = "1.3.39"
description = "Software to interact with Atlassian Cloud from the terminal"
homepage = "https://developer.atlassian.com/cloud/acli/"
license = "Proprietary"
kind = "app"
bin = ["acli.exe"]

[source.x64]
url = "https://acli.atlassian.com/windows/1.3.39-stable/acli_1.3.39-stable_windows_amd64.zip"
sha256 = "c43c6f9ceae7458efafb62b1cb0cff0287774d2d0780672fc0f718e161e4edfd"
extract_dir = "acli_1.3.39-stable_windows_amd64"

[source.arm64]
url = "https://acli.atlassian.com/windows/1.3.39-stable/acli_1.3.39-stable_windows_arm64.zip"
sha256 = "b93d808eed863226697a547f894daead8b8c5c9f97ce95244cbcbb367fce08c5"
extract_dir = "acli_1.3.39-stable_windows_arm64"

[autoupdate]
checkver = { url = "https://raw.githubusercontent.com/atlassian/homebrew-acli/main/Formula/acli.rb", regex = "version \"([\\d.]+)-stable\"" }
url_template = { x64 = "https://acli.atlassian.com/windows/$version-stable/acli_$version-stable_windows_amd64.zip", arm64 = "https://acli.atlassian.com/windows/$version-stable/acli_$version-stable_windows_arm64.zip" }
