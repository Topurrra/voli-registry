name = "acli"
version = "1.3.40"
description = "Software to interact with Atlassian Cloud from the terminal"
homepage = "https://developer.atlassian.com/cloud/acli/"
license = "Proprietary"
kind = "app"
bin = ["acli.exe"]

[source.x64]
url = "https://acli.atlassian.com/windows/1.3.40-stable/acli_1.3.40-stable_windows_amd64.zip"
sha256 = "f2075f6e5f6c025cfefa9d00cca8b073ad995a1b48a293eea8b6e7cabcbc1035"
extract_dir = "acli_1.3.40-stable_windows_amd64"

[source.arm64]
url = "https://acli.atlassian.com/windows/1.3.40-stable/acli_1.3.40-stable_windows_arm64.zip"
sha256 = "ad1fd40db3cb3fad86509d5c133f14afaaf6160ae58e540baba02600eca5da27"
extract_dir = "acli_1.3.40-stable_windows_arm64"

[autoupdate]
checkver = { url = "https://raw.githubusercontent.com/atlassian/homebrew-acli/main/Formula/acli.rb", regex = "version \"([\\d.]+)-stable\"" }
url_template = { x64 = "https://acli.atlassian.com/windows/$version-stable/acli_$version-stable_windows_amd64.zip", arm64 = "https://acli.atlassian.com/windows/$version-stable/acli_$version-stable_windows_arm64.zip" }
