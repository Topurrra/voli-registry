name = "allure"
version = "2.46.2"
description = "A flexible lightweight multi-language test report tool"
homepage = "https://allurereport.org/"
license = "Apache-2.0"
kind = "app"
extract_dir = "allure-2.46.2"
bin = ["bin\\allure.bat"]

[source.x64]
url = "https://github.com/allure-framework/allure2/releases/download/2.46.2/allure-2.46.2.zip"
