name = "amule"
version = "3.1.0"
description = "A peer-to-peer file-sharing client for the eD2k and Kademlia networks, compatible with eMule."
homepage = "https://github.com/amule-org/amule"
license = "GPL-2.0-or-later"
kind = "app"
bin = ["bin\\amulecmd.exe", "bin\\amuled.exe", "bin\\amuleweb.exe"]
shortcuts = [{ target = "bin\\amule.exe", name = "aMule" }, { target = "bin\\amulegui.exe", name = "aMule (Remote GUI)" }]

[source.x64]
url = "https://github.com/amule-org/amule/releases/download/3.1.0/aMule-3.1.0-Windows-x64.zip"
sha256 = "81d3a024207c272524e4d992bfaf352a86256b00afac414f0405ce465642cfb7"
extract_dir = "amule-portable-x64"

[source.arm64]
url = "https://github.com/amule-org/amule/releases/download/3.1.0/aMule-3.1.0-Windows-arm64.zip"
sha256 = "fc4773407159a44820ee3ac5153ba70c95f79a68e4f80d9f3c6e91301156dab0"
extract_dir = "amule-portable-arm64"

[autoupdate]
checkver = { github = "amule-org/amule" }
url_template = { x64 = "https://github.com/amule-org/amule/releases/download/$version/aMule-$version-Windows-x64.zip", arm64 = "https://github.com/amule-org/amule/releases/download/$version/aMule-$version-Windows-arm64.zip" }
