name = "arcadedb"
version = "26.8.1"
description = "Multi-model database, one DBMS that supports SQL, Cypher, Gremlin, HTTP/JSON, MongoDB and Redis"
homepage = "https://arcadedb.com"
license = "Apache-2.0"
kind = "app"
extract_dir = "arcadedb-26.8.1"
bin = [{ name = "arcadedb-console", path = "bin\\console.bat" }, { name = "arcadedb-server", path = "bin\\server.bat" }]
persist = ["config", "databases", "log"]

[source.x64]
url = "https://github.com/ArcadeData/arcadedb/releases/download/26.8.1/arcadedb-26.8.1.tar.gz"
sha256 = "e9ef74e7bc2a2ca4bf924c20d1bac9076a636aeba9e97c25e8d85e948dcd3ccb"

[env]
ARCADEDB_HOME = "{dir}"

[autoupdate]
checkver = { github = "ArcadeData/arcadedb" }
url_template = "https://github.com/ArcadeData/arcadedb/releases/download/$version/arcadedb-$version.tar.gz"
