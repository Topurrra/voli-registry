[source.x64]
url = "https://github.com/balena-io/balena-cli/releases/download/v25.2.29/balena-cli-v25.2.29-windows-x64-standalone.tar.gz"
sha256 = "66880ccc28a64979638bebc8ad741acb5c873cfd12d2ece1c472b47d940b6fde"

[autoupdate]
checkver = { github = "balena-io/balena-cli" }
