name = "betterbird"
version = "153.2.0esr-bb8"
description = "A fine-tuned version of Mozilla Thunderbird with new features, bug fixes and telemetry turned off"
homepage = "https://www.betterbird.eu"
license = "MPL-2.0"
kind = "app"
bin = [{ name = "Betterbird", path = "BetterbirdLauncher.exe" }]
shortcuts = [{ target = "BetterbirdLauncher.exe", name = "Betterbird" }]
persist = ["profile"]

[source.x64]
url = "https://www.betterbird.eu/downloads/WindowsPortable/BetterbirdPortable-153.2.0esr-bb8.en-US.win64.zip"
sha256 = "6cc845174df0d2b9a49adf6f3118c58dd3f469b13e9f9d7cb5c9842a18a14566"

[autoupdate]
checkver = "{\"regex\":\"BetterbirdPortable-([\\\\d.]+.+).en-US.win64.zip\",\"script\":[\"$url = 'https://www.betterbird.eu/downloads/get.php?os=win&lang=en-US&version=release&portable=true'\",\"$location = (Invoke-WebRequest -Uri $url -MaximumRedirection 0 -SkipHttpErrorCheck -ErrorAction SilentlyContinue).Headers.Location\",\"Write-Output $location\"]}"
url_template = { x64 = "https://www.betterbird.eu/downloads/WindowsPortable/BetterbirdPortable-$version.en-US.win64.zip" }
