name = "bleachbit"
version = "6.0.2"
description = "Disk space cleaner, privacy manager, and computer system optimizer."
homepage = "https://www.bleachbit.org/"
license = "GPL-3.0-or-later"
kind = "app"
extract_dir = "BleachBit-portable"
bin = ["bleachbit_console.exe", { name = "bleachbit", path = "bleachbit_console.exe" }]
shortcuts = [{ target = "bleachbit.exe", name = "BleachBit" }]
persist = ["cleaners", "BleachBit.ini"]

[source.x64]
url = "https://download.bleachbit.org/BleachBit-6.0.2-portable.zip"
sha256 = "0322920a592ba311cb374b4f44053ee35f793c5a5690f1f8cb419b57321b2883"

[autoupdate]
checkver = { url = "https://www.bleachbit.org/download/windows", regex = "BleachBit ([\\d.]+)" }
url_template = "https://download.bleachbit.org/BleachBit-$version-portable.zip"
