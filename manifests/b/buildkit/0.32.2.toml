name = "buildkit"
version = "0.32.2"
description = "A toolkit for converting source code to build artifacts in an efficient, expressive and repeatable manner."
homepage = "https://github.com/moby/buildkit"
license = "Apache-2.0"
kind = "app"
bin = ["bin\\buildctl.exe", "bin\\buildkitd.exe"]

[source.x64]
url = "https://github.com/moby/buildkit/releases/download/v0.32.2/buildkit-v0.32.2.windows-amd64.tar.gz"
sha256 = "b682a0dabd29137b2a5eecfcd62cd134944dffb09939b5308e1b77044a01331a"

[source.arm64]
url = "https://github.com/moby/buildkit/releases/download/v0.32.2/buildkit-v0.32.2.windows-arm64.tar.gz"
sha256 = "43bdbfcc33e1b0c73bb81298b3b8c8eeee61637c700a26c1ba134831b94a90c8"

[autoupdate]
checkver = { github = "moby/buildkit" }
url_template = { x64 = "https://github.com/moby/buildkit/releases/download/v$version/buildkit-v$version.windows-amd64.tar.gz", arm64 = "https://github.com/moby/buildkit/releases/download/v$version/buildkit-v$version.windows-arm64.tar.gz" }
