name = "cacert"
version = "2026-09-25"
description = "CA certificates extracted from the Mozilla CA certificate store, in PEM format"
homepage = "https://curl.se/docs/caextract.html"
license = "MPL-2.0"
kind = "app"

[source.x64]
url = "https://curl.se/ca/cacert-2026-09-25.pem#/cacert.pem"
sha256 = "a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505"

[autoupdate]
checkver = "cacert-([\\d-]+)\\.pem"
url_template = "https://curl.se/ca/cacert-$version.pem#/cacert.pem"
