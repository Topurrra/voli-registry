bin = ["bin\\containerd.exe", "bin\\containerd-shim-runhcs-v1.exe", "bin\\ctr.exe"]

[source.x64]
url = "https://github.com/containerd/containerd/releases/download/v2.3.3/containerd-2.3.3-windows-amd64.tar.gz"
sha256 = "f1c8115fedaa793d5a9ba7e9716f79203d599820bf06cd14b25762e06d5de512"

[autoupdate]
checkver = { github = "containerd/containerd" }
