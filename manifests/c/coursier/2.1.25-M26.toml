name = "coursier"
version = "2.1.25-M26"
description = "Pure Scala Artifact Fetching"
homepage = "https://github.com/coursier/coursier"
license = "Apache-2.0"
kind = "app"
bin = ["coursier.jar"]
persist = ["cache", "bin"]

[source.x64]
url = "https://github.com/coursier/coursier/releases/download/v2.1.25-M26/coursier#/coursier.jar"
sha256 = "d6fdd69e7337b0cbe8f27deab038775621128d9500e19de1cdb16091985489d2"

[env]
PATH = "{dir}\\bin"
COURSIER_BIN_DIR = "{dir}\\bin"
COURSIER_CACHE = "{dir}\\cache"

[autoupdate]
checkver = { github = "coursier/coursier" }
url_template = "https://github.com/coursier/coursier/releases/download/v$version/coursier#/coursier.jar"
