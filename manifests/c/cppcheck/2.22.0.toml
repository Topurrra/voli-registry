name = "cppcheck"
version = "2.22.0"
description = "Static analysis tool for C/C++ code"
homepage = "https://cppcheck.sourceforge.io/"
license = "GPL-3.0-only"
kind = "app"
extract_dir = "PFiles\\Cppcheck"
bin = ["cppcheck.exe"]
shortcuts = [{ target = "cppcheckgui.exe", name = "Cppcheck" }]

[source.x64]
url = "https://github.com/cppcheck-opensource/cppcheck/releases/download/2.22.0/cppcheck-2.22.0-x64-Setup.msi"
sha256 = "3929162bab7e71d1b9b18708ec054fb0188bfc8ea1660979ed95837f5a9f547b"
kind = "installer-archive"

[autoupdate]
checkver = { github = "cppcheck-opensource/cppcheck" }
url_template = { x64 = "https://github.com/cppcheck-opensource/cppcheck/releases/download/$version/cppcheck-$version-x64-Setup.msi" }
