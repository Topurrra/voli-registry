name = "crow-translate"
version = "3.1.0"
description = "A simple and lightweight translator that allows to translate and speak text."
homepage = "https://apps.kde.org/crowtranslate"
license = "GPL-3.0-or-later"
kind = "app"
bin = ["bin\\crow.exe"]
shortcuts = [{ target = "bin\\crow.exe", name = "Crow Translate" }]

[source.x64]
url = "https://download.kde.org/stable/crow-translate/3.1.0/crow-translate-release_3.1-433-windows-cl-msvc2019-x86_64.7z"
sha256 = "4a7ab5ddb0a62279d1fa1aed76fcd1424c0da101a0f6166b3fc77403ef219113"

[autoupdate]
checkver = { url = "https://apps.kde.org/crowtranslate", regex = "stable/crow-translate/([\\d.]+)/crow-translate-release_(?<full>[\\d.-]+)-windows-cl-(?<lib>\\w+)-x86_64\\.7z" }
url_template = { x64 = "https://download.kde.org/stable/crow-translate/$version/crow-translate-release_$matchFull-windows-cl-$matchLib-x86_64.7z" }
