name = "dbx"
version = "0.6.10"
description = "Lightweight, cross-platform database client"
homepage = "https://dbxio.com"
license = "AGPL-3.0-only"
kind = "app"
shortcuts = [{ target = "DBX.exe", name = "DBX" }]
persist = ["data"]

[source.x64]
url = "https://github.com/t8y2/dbx/releases/download/v0.6.10/DBX_0.6.10_x64-portable.zip"
sha256 = "4c85eea4f454778c50546c6e4f0e5e66b0a62b8571ea671371dce478c1ca1b75"

[env]
DBX_DATA_DIR = "{dir}\\data"

[autoupdate]
checkver = { github = "t8y2/dbx" }
