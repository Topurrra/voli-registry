homepage = "https://dbxio.com"
license = "AGPL-3.0-only"
kind = "app"
shortcuts = [{ target = "DBX.exe", name = "DBX" }]
persist = ["data"]

[source.x64]
url = "https://github.com/t8y2/dbx/releases/download/v0.6.11/DBX_0.6.11_x64-portable.zip"
sha256 = "137e9f3db3d11ca1df79f6d1cb95b3c50600141ac5890f34fa4f98b34cbfcb6a"

[env]
DBX_DATA_DIR = "{dir}\\data"

[autoupdate]
checkver = { github = "t8y2/dbx" }
