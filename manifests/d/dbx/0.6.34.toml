name = "dbx"
version = "0.6.34"
description = "Lightweight, cross-platform database client"
homepage = "https://dbxio.com"
license = "Apache-2.0"
kind = "app"
shortcuts = [{ target = "DBX.exe", name = "DBX" }]
persist = ["data"]

[source.x64]
url = "https://github.com/t8y2/dbx/releases/download/v0.6.34/DBX_0.6.34_x64-portable.zip"
