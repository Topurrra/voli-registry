name = "dbx"
version = "0.6.42"
description = "Lightweight, cross-platform database client"
homepage = "https://dbxio.com"
license = "Apache-2.0"
kind = "app"
shortcuts = [{ target = "DBX.exe", name = "DBX" }]
persist = ["data"]

[source.x64]
url = "https://github.com/t8y2/dbx/releases/download/v0.6.42/DBX_0.6.42_x64-portable.zip"
sha256 = "4e0a917f3612843750d2595dc9eebb5dc7e3dd42ee9152029c674b586d55fc73"

[source.arm64]
url = "https://github.com/t8y2/dbx/releases/download/v0.6.42/DBX_0.6.42_arm64-portable.zip"
sha256 = "38f4b68589add04cb944c34ab4655a55a3dff57f6fe672a4cab90b03bccbd9ae"

[env]
DBX_DATA_DIR = "{dir}\\data"

[autoupdate]
checkver = { github = "t8y2/dbx" }
url_template = { x64 = "https://github.com/t8y2/dbx/releases/download/v$version/DBX_$version_x64-portable.zip", arm64 = "https://github.com/t8y2/dbx/releases/download/v$version/DBX_$version_arm64-portable.zip" }
