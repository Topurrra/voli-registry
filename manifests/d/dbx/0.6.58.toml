[source.arm64]
url = "https://github.com/t8y2/dbx/releases/download/v0.6.58/DBX_0.6.58_arm64-portable.zip"
sha256 = "fc0afd249f3ad87a3108392a771c0a86dfe7c07c228301f2de57506049de3e6a"

[env]
DBX_DATA_DIR = "{dir}\\data"

[autoupdate]
checkver = { github = "t8y2/dbx" }
