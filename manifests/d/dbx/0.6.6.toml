name = "dbx"
version = "0.6.6"
description = "Lightweight, cross-platform database client"
homepage = "https://dbxio.com"
license = "AGPL-3.0-only"
kind = "app"
shortcuts = [{ target = "DBX.exe", name = "DBX" }]
persist = ["data"]

[source.x64]
url = "https://github.com/t8y2/dbx/releases/download/v0.6.6/DBX_0.6.6_x64-portable.zip"
sha256 = "479c88facd489c37fe735a1fe6f1e1a1c0a9ac45db8bcccb232d3a2e560184a6"

[env]
DBX_DATA_DIR = "{dir}\\data"

[autoupdate]
checkver = { github = "t8y2/dbx" }
