name = "dbx"
version = "0.6.65"
description = "Lightweight, cross-platform database client"
homepage = "https://dbxio.com"
license = "Apache-2.0"
kind = "app"
shortcuts = [{ target = "DBX.exe", name = "DBX" }]
persist = ["data"]

[source.x64]
url = "https://github.com/t8y2/dbx/releases/download/v0.6.65/DBX_0.6.65_x64-portable.zip"
sha256 = "d4548b84fdf41f445dd8de1d922b04cf88ee703b5581cf9143eeef1ed21c55e5"

[source.arm64]
url = "https://github.com/t8y2/dbx/releases/download/v0.6.65/DBX_0.6.65_arm64-portable.zip"
sha256 = "c1646d070c7e019eb0bf575d71cfe74d5327ad5e0f89e47edd4b088b7243b122"

[env]
DBX_DATA_DIR = "{dir}\\data"

[autoupdate]
checkver = { github = "t8y2/dbx" }
