name = "deepstream"
version = "10.2.1"
description = "Realtime, fast and secure data-sync server for mobile, web & iot"
homepage = "https://deepstream.io"
license = "AGPL-3.0-or-later"
kind = "app"
bin = ["deepstream.exe"]
persist = ["conf"]
shortcuts = []
write_file = []

[source.x64]
url = "https://github.com/deepstreamIO/deepstream.io/releases/download/v10.2.1/deepstream.io-windows-10.2.1.zip"
sha256 = "87d1388d1a97f91e59b88d4258de2792257eedffbc2ac4d6589f3d639bd2c1fe"
extra = []

[env]
DEEPSTREAM_CONFIG_DIRECTORY = '{dir}\conf\config.yml'

[depends]

[autoupdate.checkver]
github = "deepstreamIO/deepstream.io"

[autoupdate.url_template]
x64 = "https://github.com/deepstreamIO/deepstream.io/releases/download/v$version/deepstream.io-windows-$version.zip"
