name = "docker"
version = "29.8.0"
description = "Docker CLI & Docker Engine for Windows containers. Docker is an open platform for developing, shipping, and running applications."
homepage = "https://docs.docker.com/engine"
license = "Apache-2.0"
kind = "app"
extract_dir = "docker"
bin = ["docker.exe", "dockerd.exe"]

[source.x64]
url = "https://download.docker.com/win/static/stable/x86_64/docker-29.8.0.zip"
sha256 = "bca70bfcddb4eed5bb8af5c15a1fb583b95edacf6096152e20a621ae68c871cb"

[autoupdate]
checkver = { github = "moby/moby" }
url_template = { x64 = "https://download.docker.com/win/static/stable/x86_64/docker-$version.zip" }
