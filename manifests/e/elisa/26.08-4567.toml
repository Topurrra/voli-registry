[autoupdate]
checkver = "{\"regex\":\"([\\\\d.-]+) (?<lib>[\\\\w]+)\",\"script\":[\"$url = 'https://cdn.kde.org/ci-builds/multimedia/elisa/?C=N;O=D'\",\"\",\"$cont = (Invoke-WebRequest $url).Content\",\"$regex = 'release-([\\\\d.]+)'\",\"if (!($cont -match $regex)) { error \\\"Could not match $regex in $url\\\"; continue }\",\"$ver = $matches[1]\",\"\",\"$nextUrl = \\\"https://cdn.kde.org/ci-builds/multimedia/elisa/release-$ver/windows/\\\"\",\"$nextCont = (Invoke-WebRequest $nextUrl).Content\",\"$nextRegex = \\\"elisa-release_$ver-([\\\\d]+)-windows-cl-([\\\\w]+)-x86_64\\\\.7z\\\"\",\"if (!($nextCont -match $nextRegex)) { error \\\"Could not match $nextRegex in $nextUrl\\\"; continue }\",\"$build = $matches[1]\",\"$lib = $matches[2]\",\"Write-Output $ver-$build $lib\"]}"
url_template = { x64 = "https://cdn.kde.org/ci-builds/multimedia/elisa/release-$matchHead/windows/elisa-release_$version-windows-cl-$matchLib-x86_64.7z" }
