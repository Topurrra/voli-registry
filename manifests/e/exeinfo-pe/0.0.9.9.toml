name = "exeinfo-pe"
version = "0.0.9.9"
description = "EXE analyzer inspired by PEiD. Designed to detect exe signatures, compressor format and dump internal information."
homepage = "http://www.exeinfo.xn.pl/"
license = "Freeware"
kind = "app"
extract_dir = "ExeinfoPe"
bin = ["exeinfope.exe"]
shortcuts = [{ target = "exeinfope.exe", name = "Exeinfo PE" }]
persist = ["plugins", "exeinfopeRUN.cfg", "userdb.txt"]

[source.x64]
url = "https://raw.githubusercontent.com/ExeinfoASL/ASL/master/exeinfope.zip"
sha256 = "6a0d8c0930a58dd3e070993f3d92136deb9f912935888a40268bfe7fd00e4ef2"

[autoupdate]
checkver = { url = "https://raw.githubusercontent.com/ExeinfoASL/ASL/master/README.md", regex = "Version\\s+\\: ([\\d.]+)" }
