name = "ghidra"
version = "12.1.2-20260605"
description = "a software reverse engineering (SRE) framework"
homepage = "https://ghidra-sre.org"
license = "Apache-2.0"
kind = "app"
bin = ["ghidraRun.bat"]
persist = ["Ghidra/Configurations"]

[source.x64]
url = "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.2_build/ghidra_12.1.2_PUBLIC_20260605.zip"
sha256 = "b62e81a0390618466c019c60d8c2f796ced2509c4c1aea4a37644a77272cf99d"

[env]
GHIDRA_INSTALL_DIR = "{dir}"

[autoupdate]
checkver = "{\"github\":\"https://api.github.com/repos/NationalSecurityAgency/ghidra/releases/latest\",\"jsonpath\":\"$.assets[*].browser_download_url\",\"regex\":\"ghidra_([\\\\d.]+)_PUBLIC_(?<releasedate>\\\\d+)\\\\.zip\",\"replace\":\"${1}-${2}\"}"
