name = "glab"
version = "1.110.0"
description = "GitLab CLI"
homepage = "https://gitlab.com/gitlab-org/cli"
license = "MIT"
kind = "app"
bin = ['bin\glab.exe']
persist = []
shortcuts = []
write_file = []

[source.x64]
url = "https://gitlab.com/gitlab-org/cli/-/releases/v1.110.0/downloads/glab_1.110.0_windows_amd64.zip"
