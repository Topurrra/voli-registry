name = "glfw"
version = "3.5.1"
description = "GLFW is an Open Source, multi-platform library for OpenGL, OpenGL ES and Vulkan application development."
homepage = "https://github.com/glfw/glfw"
license = "zlib-acknowledgement"
kind = "app"
extract_dir = "glfw-3.5.1.bin.WIN64"

[source.x64]
url = "https://github.com/glfw/glfw/releases/download/3.5.1/glfw-3.5.1.bin.WIN64.zip"
sha256 = "34c6766043e09ad9c6e88b5636a5f34d1f2857aae828768c5bf2016dc8821a93"

[env]
GLFW_ROOT = "{dir}"

[autoupdate]
checkver = { github = "glfw/glfw" }
url_template = { x64 = "https://github.com/glfw/glfw/releases/download/$version/glfw-$version.bin.WIN64.zip" }
