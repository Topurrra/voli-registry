name = "gnutls"
version = "3.8.13"
description = "GnuTLS is a secure communications library implementing the SSL, TLS and DTLS protocols and technologies around them."
homepage = "https://www.gnutls.org"
license = "LGPL-2.1-or-later,GPL-3.0-or-later"
kind = "app"
extract_dir = "win64-build"

[source.x64]
url = "https://www.gnupg.org/ftp/gcrypt/gnutls/v3.8/gnutls-3.8.13-w64.zip"
sha256 = "68a42ce15737a3c640a719b0323e426dc36a51eed3906bf89dda7965390cd969"

[env]
PATH = "{dir}\\bin"

[autoupdate]
checkver = { url = "https://www.gnutls.org/manual/gnutls.html", regex = "GnuTLS ([\\d.]+)" }
url_template = { x64 = "https://www.gnupg.org/ftp/gcrypt/gnutls/v$majorVersion.$minorVersion/gnutls-$version-w64.zip" }
