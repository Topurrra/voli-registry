name = "golangci-lint"
version = "2.13.2"
description = "Go language linters aggregator"
homepage = "https://golangci-lint.run/"
license = "GPL-3.0-only"
kind = "app"
bin = ["golangci-lint.exe"]

[source.x64]
url = "https://github.com/golangci/golangci-lint/releases/download/v2.13.2/golangci-lint-2.13.2-windows-amd64.zip"
sha256 = "4735fdc8e84a0cfb7a15a1c364a650942f88215e0d36c674ebc4024f7b554524"
extract_dir = "golangci-lint-2.13.2-windows-amd64"

[source.arm64]
url = "https://github.com/golangci/golangci-lint/releases/download/v2.13.2/golangci-lint-2.13.2-windows-arm64.zip"
sha256 = "2dbffbd1225d41ac5740f0b478a43b6517f3e3f702fe0ab3aec470bd6ec8e263"
extract_dir = "golangci-lint-2.13.2-windows-arm64"

[autoupdate]
checkver = { github = "golangci/golangci-lint" }
url_template = { x64 = "https://github.com/golangci/golangci-lint/releases/download/v$version/golangci-lint-$version-windows-amd64.zip", arm64 = "https://github.com/golangci/golangci-lint/releases/download/v$version/golangci-lint-$version-windows-arm64.zip" }
