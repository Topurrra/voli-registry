name = "golangci-lint"
version = "2.14.0"
description = "Go language linters aggregator"
homepage = "https://golangci-lint.run/"
license = "GPL-3.0-only"
kind = "app"
bin = ["golangci-lint.exe"]

[source.x64]
url = "https://github.com/golangci/golangci-lint/releases/download/v2.14.0/golangci-lint-2.14.0-windows-amd64.zip"
sha256 = "b15f903d1649283a2ab6e8d2f0c317eaf1f9f6b3763950e7e8b7e72a43dd724f"
extract_dir = "golangci-lint-2.14.0-windows-amd64"

[source.arm64]
url = "https://github.com/golangci/golangci-lint/releases/download/v2.14.0/golangci-lint-2.14.0-windows-arm64.zip"
sha256 = "6399496aef883e5d2f77ea93e6e54fdd05bc2695f64071d8de0b0579cad92274"
extract_dir = "golangci-lint-2.14.0-windows-arm64"

[autoupdate]
checkver = { github = "golangci/golangci-lint" }
url_template = { x64 = "https://github.com/golangci/golangci-lint/releases/download/v$version/golangci-lint-$version-windows-amd64.zip", arm64 = "https://github.com/golangci/golangci-lint/releases/download/v$version/golangci-lint-$version-windows-arm64.zip" }
