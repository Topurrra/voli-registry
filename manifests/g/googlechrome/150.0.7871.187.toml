checkver = "{\"regex\":\"(?<version>[\\\\d.]+),(?<archx64>[^,]+),(?<archx86>[^,]+),(?<archarm64>[^,]+)\",\"script\":[\"$AppID = '{8A69D345-D564-463C-AFF1-A69D9E530F96}'\",\"$ArchParams  = @{\",\"    'x64'   ='x64-stable'\",\"    'x86'   ='x86-stable'\",\"    'arm64' ='arm64-stable'\",\"}\",\"$BodyTemplate = @(\",\"    '<?xml version=\\\"1.0\\\" encoding=\\\"utf-8\\\"?>',\",\"    '<request protocol=\\\"3.0\\\">',\",\"    '  <os platform=\\\"win\\\" version=\\\"10.0.22000\\\" arch=\\\"{0}\\\"/>',\",\"    '  <app appid=\\\"{1}\\\" ap=\\\"{2}\\\" version=\\\"\\\">',\",\"    '    <updatecheck/>',\",\"    '  </app>',\",\"    '</request>'\",\") -join \\\"`n\\\"\",\"$ArchURLs = @{}\",\"$Version = $null\",\"forEach ($Arch in $ArchParams.Keys) {\",\"    $Body = $BodyTemplate -f $Arch, $AppID, $ArchParams[$Arch]\",\"    $Response = Invoke-RestMethod -Uri 'https://update.googleapis.com/service/update2' -Method Post -Body $Body\",\"    if ($Arch -eq 'x64') {\",\"        $Version = $Response.response.app.updatecheck.manifest.version\",\"    }\",\"    $BaseURL = $Response.SelectSingleNode(\\\"//url[starts-with(@codebase, 'https://dl.google.com/release2/chrome/')]\\\")\",\"    $BaseURL.GetAttribute('codebase') -match '^https://dl\\\\.google\\\\.com/release2/chrome/(?<URL>[^/]+)/'\",\"    $FileName = $Response.SelectSingleNode('//package').GetAttribute('name')\",\"    $ArchURLs[$Arch] = \\\"$($Matches['URL'])/$FileName\\\"\",\"}\",\"Write-Output \\\"$Version,$($ArchURLs['x64']),$($ArchURLs['x86']),$($ArchURLs['arm64'])\\\"\"]}"
