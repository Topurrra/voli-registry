name = "graalvm19-jdk8"
version = "19.3.6"
description = "High-performance, embeddable, polyglot Virtual Machine for JVM-langs (Java, Scala, Kotlin), JavaScript/NodeJS, Python, Ruby, R, and LLVM-langs (C, C++, Rust)"
homepage = "https://www.graalvm.org/"
license = "GPL-2.0"
kind = "app"

[source.x64]
url = "https://github.com/graalvm/graalvm-ce-builds/releases/download/vm-19.3.6/graalvm-ce-java8-windows-amd64-19.3.6.zip"
sha256 = "77e5e6db836ee8c9ba470f5c401bf8216ba3df0ad1766b4e426216c432f7ae6e"

[env]
PATH = "{dir}\\bin"
GRAALVM_HOME = "{dir}"
JAVA_HOME = "{dir}"

[autoupdate]
checkver = "{\"jsonpath\":\"$.[?(@.name =~ /^vm-19[\\\\d.]+$/)].name\",\"regex\":\"vm-([\\\\d.]+)\",\"url\":\"https://api.github.com/repos/graalvm/graalvm-ce-builds/tags?per_page=200&page=1\"}"
