name = "graalvm20-jdk11"
version = "20.3.6"
description = "High-performance, embeddable, polyglot Virtual Machine for JVM-langs (Java, Scala, Kotlin), JavaScript/NodeJS, Python, Ruby, R, and LLVM-langs (C, C++, Rust)"
homepage = "https://www.graalvm.org/"
license = "GPL-2.0"
kind = "app"

[source.x64]
url = "https://github.com/graalvm/graalvm-ce-builds/releases/download/vm-20.3.6/graalvm-ce-java11-windows-amd64-20.3.6.zip"
sha256 = "7c98ffea7530b78bac53221316256b3492d9433800c7ffa945478bf0e652cfb5"

[env]
GRAALVM_HOME = "{dir}"
JAVA_HOME = "{dir}"
PATH = "{dir}\\bin"

[autoupdate]
checkver = "{\"jsonpath\":\"$.[?(@.name =~ /^vm-20[\\\\d.]+$/)].name\",\"regex\":\"vm-([\\\\d.]+)\",\"url\":\"https://api.github.com/repos/graalvm/graalvm-ce-builds/tags?per_page=200&page=1\"}"
