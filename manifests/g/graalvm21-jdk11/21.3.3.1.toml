name = "graalvm21-jdk11"
version = "21.3.3.1"
description = "High-performance, embeddable, polyglot Virtual Machine for JVM-langs (Java, Scala, Kotlin), JavaScript/NodeJS, Python, Ruby, R, and LLVM-langs (C, C++, Rust)"
homepage = "https://www.graalvm.org/"
license = "GPL-2.0"
kind = "app"

[source.x64]
url = "https://github.com/graalvm/graalvm-ce-builds/releases/download/vm-21.3.3.1/graalvm-ce-java11-windows-amd64-21.3.3.1.zip"
sha256 = "1471a32cd3ed9cf3598792751921374e1f2e98eb43672160a477f40926d179d3"

[env]
GRAALVM_HOME = "{dir}"
JAVA_HOME = "{dir}"
PATH = "{dir}\\bin"

[autoupdate]
checkver = "{\"jsonpath\":\"$.[?(@.name =~ /^vm-21[\\\\d.]+$/)].name\",\"regex\":\"vm-([\\\\d.]+)\",\"url\":\"https://api.github.com/repos/graalvm/graalvm-ce-builds/tags?per_page=200&page=1\"}"
