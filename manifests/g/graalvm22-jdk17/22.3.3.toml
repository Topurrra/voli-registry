name = "graalvm22-jdk17"
version = "22.3.3"
description = "High-performance, embeddable, polyglot Virtual Machine for JVM-langs (Java, Scala, Kotlin), JavaScript/NodeJS, Python, Ruby, R, and LLVM-langs (C, C++, Rust)"
homepage = "https://www.graalvm.org/"
license = "GPL-2.0"
kind = "app"

[source.x64]
url = "https://github.com/graalvm/graalvm-ce-builds/releases/download/vm-22.3.3/graalvm-ce-java17-windows-amd64-22.3.3.zip"
sha256 = "ae857edaf792bee3e842d68fb5e9138f3897b548c3dc48b3647dee6803e79abb"

[env]
GRAALVM_HOME = "{dir}"
JAVA_HOME = "{dir}"
PATH = "{dir}\\bin"

[autoupdate]
checkver = "{\"jsonpath\":\"$.[?(@.name =~ /^vm-22[\\\\d.]+$/)].name\",\"regex\":\"vm-([\\\\d.]+)\",\"url\":\"https://api.github.com/repos/graalvm/graalvm-ce-builds/tags?per_page=200&page=1\"}"
