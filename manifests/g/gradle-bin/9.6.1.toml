name = "gradle-bin"
version = "9.6.1"
description = "An open-source build automation tool focused on flexibility and performance. (Binaries only without documentation)"
homepage = "https://gradle.org"
license = "Apache-2.0"
kind = "app"
extract_dir = "gradle-9.6.1"
bin = ["bin\\gradle.bat"]
persist = [".gradle"]

[source.x64]
url = "https://services.gradle.org/distributions/gradle-9.6.1-bin.zip"
sha256 = "9c0f7faeeb306cb14e4279a3e084ca6b596894089a0638e68a07c945a32c9e14"

[autoupdate]
checkver = "{\"jsonpath\":\"$.version\",\"url\":\"https://services.gradle.org/versions/current\"}"
url_template = "https://services.gradle.org/distributions/gradle-$version-bin.zip"
