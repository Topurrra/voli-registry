homepage = "https://gradle.org"
license = "Apache-2.0"
kind = "app"
extract_dir = "gradle-9.8.0"
bin = ["bin\\gradle.bat"]
persist = [".gradle"]

[source.x64]
url = "https://services.gradle.org/distributions/gradle-9.8.0-all.zip"
