name = "groovy"
version = "5.1.2"
description = "A powerful, optionally typed and dynamic language, with static-typing and static compilation capabilities, for the Java platform aimed at improving developer productivity thanks to a concise, familiar and easy to learn syntax."
homepage = "https://www.groovy-lang.org"
license = "Apache-2.0"
kind = "app"
extract_dir = "groovy-5.1.2"
bin = ["bin\\grape.bat", "bin\\groovy.bat", "bin\\groovyc.bat", "bin\\groovyConsole.bat", "bin\\groovydoc.bat", "bin\\groovysh.bat", "bin\\java2groovy.bat", "bin\\startGroovy.bat"]

[source.x64]
url = "https://groovy.jfrog.io/artifactory/dist-release-local/groovy-zips/apache-groovy-binary-5.1.2.zip"
sha256 = "19cd28c23c34f8b52f1bb602da9186792b7464e35dd8300d84f6735b8ad3965f"

[env]
GROOVY_HOME = "{dir}"

[autoupdate]
checkver = { url = "https://groovy.apache.org/download.html", regex = "apache-groovy-binary-([\\d.]+)\\.zip" }
url_template = "https://groovy.jfrog.io/artifactory/dist-release-local/groovy-zips/apache-groovy-binary-$version.zip"
