name = "hadoop-winutils"
version = "2.8.1"
description = "Windows binaries for Hadoop versions."
homepage = "https://github.com/steveloughran/winutils"
license = "Apache-2.0"
kind = "app"
extract_dir = "hadoop-2.8.1"
bin = ["bin\\winutils.exe"]

[source.x64]
url = "https://github.com/steveloughran/winutils/releases/download/tag_2017-08-29-hadoop-2.8.1-native/hadoop-2.8.1.zip"
sha256 = "ff099578a2bf618c3e3df95a76fdd2763d98f0e815560af6e7cfd2c92c04ed57"

[env]
PATH = "{dir}\\bin"
HADOOP_HOME = "{dir}"

[autoupdate]
checkver = { github = "steveloughran/winutils" }
url_template = "https://github.com/steveloughran/winutils/releases/download/$matchTag/hadoop-$version.zip"
