name = "haruna"
version = "1.8.1"
description = "An open source media player built with Qt/QML and libmpv."
homepage = "https://haruna.kde.org"
license = "GPL-3.0-or-later"
kind = "app"
bin = ["bin\\haruna.exe"]
shortcuts = [{ target = "bin\\haruna.exe", name = "Haruna" }]

[source.x64]
url = "https://download.kde.org/stable/haruna/1.8.1/haruna-1.8.1-windows-gcc-x86_64.7z"
sha256 = "53e42bac6fc8b75c8fe5486c13e5cd0d565ac09d838d860cdf3db42069fd9ecc"

[autoupdate]
checkver = { url = "https://apps.kde.org/haruna/index.xml", regex = "<title>Release (?<version>[\\d.]+)" }
url_template = { x64 = "https://download.kde.org/stable/haruna/$version/haruna-$version-windows-gcc-x86_64.7z" }
