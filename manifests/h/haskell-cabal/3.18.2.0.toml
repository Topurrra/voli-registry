name = "haskell-cabal"
version = "3.18.2.0"
description = "Cabal is a system for building and packaging Haskell libraries and programs."
homepage = "https://www.haskell.org/cabal/"
license = "BSD-3-Clause"
kind = "app"
bin = ["cabal.exe"]

[source.x64]
url = "https://downloads.haskell.org/~cabal/cabal-install-latest/cabal-install-3.18.2.0-x86_64-mingw64.zip"
sha256 = "7430982fd2aedef41539155d819e7e24349c664206ecf8c6e53c1c31acdbe630"

[autoupdate]
checkver = { url = "https://downloads.haskell.org/~cabal/cabal-install-latest/", regex = "cabal-install-([\\d.-]+)-x86_64-mingw64\\.zip" }
url_template = { x64 = "https://downloads.haskell.org/~cabal/cabal-install-latest/cabal-install-$version-x86_64-mingw64.zip" }
