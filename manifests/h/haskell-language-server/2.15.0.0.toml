name = "haskell-language-server"
version = "2.15.0.0"
description = "The official language server for Haskell."
homepage = "https://github.com/haskell/haskell-language-server"
license = "Apache-2.0"
kind = "app"

[source.x64]
url = "https://github.com/haskell/haskell-language-server/releases/download/2.15.0.0/haskell-language-server-2.15.0.0-x86_64-mingw64.zip"
sha256 = "dbd244dd6860e821c1696b6687d9fd89410d5dbc5e3a350bc76bfcc32c1f3c90"

[env]
PATH = "{dir}"

[autoupdate]
checkver = { github = "haskell/haskell-language-server" }
url_template = { x64 = "https://github.com/haskell/haskell-language-server/releases/download/$version/haskell-language-server-$version-x86_64-mingw64.zip" }
