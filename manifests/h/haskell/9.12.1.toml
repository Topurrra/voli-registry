name = "haskell"
version = "9.12.1"
description = "An advanced, purely functional programming language."
homepage = "https://www.haskell.org"
license = "BSD-3-Clause"
kind = "app"
extract_dir = "ghc-9.12.1-x86_64-unknown-mingw32"
bin = ["bin\\ghc.exe", "bin\\ghci.exe", "bin\\ghc-pkg.exe", "bin\\haddock.exe", "bin\\hp2ps.exe", "bin\\hpc.exe", "bin\\hsc2hs.exe", "bin\\runghc.exe"]

[source.x64]
url = "https://downloads.haskell.org/~ghc/9.12.1/ghc-9.12.1-x86_64-unknown-mingw32.tar.xz"
sha256 = "22dc942be1b968d5e28e75c06aba52829d0c52d9234bc9941df9ab2a0e2a610d"

[env]
PATH = "{dir}\\lib\\bin"

[autoupdate]
checkver = "{\"regex\":\"(?s)Current Stable Releases.*?>([\\\\d.]+)<\",\"url\":\"https://www.haskell.org/ghc/download.html\"}"
