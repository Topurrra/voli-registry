name = "helm-chart-testing"
version = "3.14.0"
description = "Tool for testing Helm charts. It is meant to be used for linting and testing pull requests. It automatically detects charts changed against the target branch."
homepage = "https://github.com/helm/chart-testing/"
license = "Apache-2.0"
kind = "app"
bin = ["ct.exe"]

[source.x64]
url = "https://github.com/helm/chart-testing/releases/download/v3.14.0/chart-testing_3.14.0_windows_amd64.zip"
sha256 = "0720a57213521a627d74cb2fe3da16197fd5c8dd382c01cdb0b20682a5df98d9"

[source.arm64]
url = "https://github.com/helm/chart-testing/releases/download/v3.14.0/chart-testing_3.14.0_windows_arm64.zip"
sha256 = "6b6e6aa1f663992d7acab7e31c2beec4a09d495756d6a95ea6b7354156fe9104"

[autoupdate]
checkver = { github = "helm/chart-testing" }
url_template = { x64 = "https://github.com/helm/chart-testing/releases/download/v$version/chart-testing_$version_windows_amd64.zip", arm64 = "https://github.com/helm/chart-testing/releases/download/v$version/chart-testing_$version_windows_arm64.zip" }
