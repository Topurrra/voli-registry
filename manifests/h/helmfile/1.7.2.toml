name = "helmfile"
version = "1.7.2"
description = "Command line interface to deploy Kubernetes Helm Charts."
homepage = "https://github.com/helmfile/helmfile"
license = "MIT"
kind = "app"
bin = ["helmfile.exe"]

[source.x64]
url = "https://github.com/helmfile/helmfile/releases/download/v1.7.2/helmfile_1.7.2_windows_amd64.tar.gz"
sha256 = "e8396b1d939354014fd5658db85d67d17d8f909e4503a2a5c1a636704ffc813c"

[source.arm64]
url = "https://github.com/helmfile/helmfile/releases/download/v1.7.2/helmfile_1.7.2_windows_arm64.tar.gz"
sha256 = "e93e8922146015572c758d123a4953c175622c3a24f8f26777fe6207b84f49de"

[autoupdate]
checkver = { github = "helmfile/helmfile" }
url_template = { x64 = "https://github.com/helmfile/helmfile/releases/download/v$version/helmfile_$version_windows_amd64.tar.gz", arm64 = "https://github.com/helmfile/helmfile/releases/download/v$version/helmfile_$version_windows_arm64.tar.gz" }
