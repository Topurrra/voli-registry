name = "helmfile"
version = "1.7.3"
description = "Command line interface to deploy Kubernetes Helm Charts."
homepage = "https://github.com/helmfile/helmfile"
license = "MIT"
kind = "app"
bin = ["helmfile.exe"]

[source.x64]
url = "https://github.com/helmfile/helmfile/releases/download/v1.7.3/helmfile_1.7.3_windows_amd64.tar.gz"
sha256 = "7c57c0199fe2d02fcc6b7c23fa3e247a49380d09ceacab4fb45097a2adcfdfb6"

[source.arm64]
url = "https://github.com/helmfile/helmfile/releases/download/v1.7.3/helmfile_1.7.3_windows_arm64.tar.gz"
sha256 = "e2d152ebb330cf1ac3425a38d57e871d6258a328f4e911e071560cae4bb02dae"

[autoupdate]
checkver = { github = "helmfile/helmfile" }
url_template = { x64 = "https://github.com/helmfile/helmfile/releases/download/v$version/helmfile_$version_windows_amd64.tar.gz", arm64 = "https://github.com/helmfile/helmfile/releases/download/v$version/helmfile_$version_windows_arm64.tar.gz" }
