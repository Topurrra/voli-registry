name = "ibmcloud-cli"
version = "2.47.1"
description = "The command line client for IBM Cloud"
homepage = "https://www.ibm.com/cloud/cli"
license = "Apache-2.0"
kind = "app"
extract_dir = "IBM_Cloud_CLI"
bin = ["ibmcloud.exe"]
persist = ["config"]

[source.x64]
url = "https://download.clis.cloud.ibm.com/ibm-cloud-cli/2.47.1/binaries/IBM_Cloud_CLI_2.47.1_windows_amd64.zip"
sha256 = "2d4a3353d117070cd091e709a3aeed42094ba22b97e2be6ef64c81f82aeb0645"

[env]
IBMCLOUD_HOME = "{dir}\\config"

[autoupdate]
checkver = "{\"jsonpath\":\"$.latest_version\",\"url\":\"https://download.clis.cloud.ibm.com/ibm-cloud-cli-metadata/info.json\"}"
url_template = { x64 = "https://download.clis.cloud.ibm.com/ibm-cloud-cli/$version/binaries/IBM_Cloud_CLI_$version_windows_amd64.zip" }
