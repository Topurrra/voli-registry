name = "ijhttp"
version = "261.25134.95"
description = "Allows to run HTTP requests from a terminal, without the IDE, or include HTTP request testing in a CI workflow."
homepage = "https://www.jetbrains.com/help/idea/http-client-cli.html"
license = "Freeware"
kind = "app"
extract_dir = "ijhttp"
bin = ["ijhttp.bat"]

[source.x64]
url = "https://download.jetbrains.com/resources/intellij/http-client/261.25134.95/intellij-http-client.zip"
sha256 = "4656e9c1e2c798fbe7fd78ed8fc124bc071ebb46e02770e198a562689da32c9d"

[autoupdate]
checkver = "{\"regex\":\"/http-client/([\\\\d.]+)/\",\"script\":[\"$resp = [System.Net.WebRequest]::Create('https://jb.gg/ijhttp/latest').GetResponse()\",\"Write-Output = $resp.ResponseUri.LocalPath\"]}"
