sha256 = "94c025d0f572b1f7db03c380002485b49069c6d02796f462ffd7052874ba7467"
extra = []
kind = "installer-archive"

[source.arm64]
url = "https://github.com/ImageMagick/ImageMagick/releases/download/7.1.2-29/ImageMagick-7.1.2-29-Q16-HDRI-arm64-dll.exe"
sha256 = "3486e3ee2a32a5fe2bf5d9388ed859ef5ab5bbf1b418d6ab8ef4a8a3d892cce9"
extra = []
