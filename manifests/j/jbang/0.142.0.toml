name = "jbang"
version = "0.142.0"
description = "The tool to run java, jar or jsh files with automatic dependency fetching, immediate compilation and execution"
homepage = "https://jbang.dev/"
license = "MIT"
kind = "app"
extract_dir = "jbang-0.142.0"

[source.x64]
url = "https://github.com/jbangdev/jbang/releases/download/v0.142.0/jbang-0.142.0.zip"
sha256 = "8bee0bd035344cc46322aff7117ec475d48cefe37f2a79ff2c6ee3db577bb070"

[env]
PATH = "{dir}\\bin"

[autoupdate]
checkver = { github = "jbangdev/jbang" }
url_template = "https://github.com/jbangdev/jbang/releases/download/v$version/jbang-$version.zip"
