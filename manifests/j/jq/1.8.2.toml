# jq tags releases "jq-<version>", and github checkver only strips a leading "v"
# (voli-index-tool github_version), so it would resolve the version as
# "jq-1.8.2". Read the tag out of the releases feed instead.
[autoupdate]
checkver = { url = "https://github.com/jqlang/jq/releases.atom", regex = "Repository/\\d+/jq-([\\d.]+)<" }
url_template = { x64 = "https://github.com/jqlang/jq/releases/download/jq-$version/jq-windows-amd64.exe", arm64 = "https://github.com/jqlang/jq/releases/download/jq-$version/jq-windows-arm64.exe" }
