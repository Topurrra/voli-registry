name = "kotlin-native"
version = "2.4.20"
description = "An LLVM backend for the Kotlin compiler, runtime implementation, and native code generation facility using the LLVM toolchain for native binaries runnable without a virtual machine."
homepage = "https://kotlinlang.org"
license = "Apache-2.0"
kind = "app"
extract_dir = "kotlin-native-prebuilt-windows-x86_64-2.4.20"
bin = ["bin\\cinterop.bat", "bin\\klib.bat", "bin\\konanc.bat", "bin\\generate-platform.bat", "bin\\kotlinc-native.bat", "bin\\run_konan.bat"]

[source.x64]
url = "https://github.com/JetBrains/kotlin/releases/download/v2.4.20/kotlin-native-prebuilt-windows-x86_64-2.4.20.zip"
sha256 = "00e1b0ae0ce135f20db90007208cec3dc7b8c33cd6f489bae84d790349f04d93"

[env]
PATH = "{dir}\\bin"

[autoupdate]
checkver = "{\"github\":\"https://api.github.com/repos/JetBrains/kotlin/releases/latest\",\"jsonpath\":\"$..browser_download_url\",\"regex\":\"windows-x86_64-([\\\\w.\\\\-]+)\\\\.zip\"}"
url_template = { x64 = "https://github.com/JetBrains/kotlin/releases/download/v$matchHead/kotlin-native-prebuilt-windows-x86_64-$version.zip" }
