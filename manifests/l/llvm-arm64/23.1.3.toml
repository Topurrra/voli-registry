name = "llvm-arm64"
version = "23.1.3"
description = "Collection of modular and reusable compiler and toolchain technologies. (arm64/aarch64 only)"
homepage = "https://www.llvm.org"
license = "NCSA"
kind = "app"
extract_dir = "LLVM"

[source.arm64]
url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.3/LLVM-23.1.3-woa64.msi"
sha256 = "19750061816ff721966dff175288e940889aae2dd6e8643eaf9a14a03ee728ed"
kind = "installer-archive"

[env]
LIBCLANG_PATH = "{dir}\\bin"
LLVM_LIB_DIR = "{dir}\\lib"
PATH = "{dir}\\bin"

[autoupdate]
checkver = { github = "llvm/llvm-project" }
url_template = { arm64 = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$version/LLVM-$version-woa64.msi" }
