name = "llvm"
version = "23.1.3"
description = "Collection of modular and reusable compiler and toolchain technologies."
homepage = "https://www.llvm.org"
license = "NCSA"
kind = "app"
extract_dir = "LLVM"

[source.x64]
url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.3/LLVM-23.1.3-win64.msi"
sha256 = "5153f848ac87553118340f16f8d3cd4351d729bcba6e4785c6a4a9af29676de9"
kind = "installer-archive"

[env]
LIBCLANG_PATH = "{dir}\\bin"
LLVM_LIB_DIR = "{dir}\\lib"
PATH = "{dir}\\bin"

[autoupdate]
checkver = { github = "llvm/llvm-project" }
url_template = { x64 = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$version/LLVM-$version-win64.msi" }
