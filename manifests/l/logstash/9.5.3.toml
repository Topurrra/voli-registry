name = "logstash"
version = "9.5.3"
description = "A data processing pipeline that ingests data from a multitude of sources simultaneously, transforms it, and then sends it to your favorite \"stash\"."
homepage = "https://www.elastic.co/logstash"
license = "Freeware|Apache-2.0"
kind = "app"
extract_dir = "logstash-9.5.3"
bin = [{ name = "logstash", path = "bin\\logstash.bat" }, { name = "logstash-plugin", path = "bin\\logstash-plugin.bat" }]
persist = ["config", "data"]

[source.x64]
url = "https://artifacts.elastic.co/downloads/logstash/logstash-9.5.3-windows-x86_64.zip"
sha512 = "3167c435bdd1a270184a6d2f1fcb325408ab9a3fcf3d931351a069a1f5c999ed790a8b1401477c698ddefa8212c913dda8a628e1f6a7f8ba385f2b5b01c9ec53"

[autoupdate]
checkver = { url = "https://www.elastic.co/downloads/logstash", regex = "logstash-([\\d.]+)-windows-x86_64\\.zip" }
url_template = { x64 = "https://artifacts.elastic.co/downloads/logstash/logstash-$version-windows-x86_64.zip" }
