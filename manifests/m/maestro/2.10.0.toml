name = "maestro"
version = "2.10.0"
description = "An open-source framework that makes UI and end-to-end testing for Android, iOS, and web apps simple and fast."
homepage = "https://maestro.dev"
license = "Apache-2.0"
kind = "app"
extract_dir = "maestro"
bin = ["bin\\maestro.bat"]

[source.x64]
url = "https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.10.0/maestro.zip"
sha256 = "29b675e10cc12080e445e9bfb2e2b4e4dfb9c0f2e30d5884120d258b5e1cd991"

[env]
MAESTRO_HOME = "{dir}"

[autoupdate]
checkver = { github = "mobile-dev-inc/Maestro" }
url_template = "https://github.com/mobile-dev-inc/Maestro/releases/download/cli-$version/maestro.zip"
