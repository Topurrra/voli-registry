name = "maestro"
version = "2.11.0"
description = "An open-source framework that makes UI and end-to-end testing for Android, iOS, and web apps simple and fast."
homepage = "https://maestro.dev"
license = "Apache-2.0"
kind = "app"
extract_dir = "maestro"
bin = ["bin\\maestro.bat"]

[source.x64]
url = "https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.11.0/maestro.zip"
sha256 = "5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a"

[env]
MAESTRO_HOME = "{dir}"

[autoupdate]
checkver = { github = "mobile-dev-inc/Maestro" }
url_template = "https://github.com/mobile-dev-inc/Maestro/releases/download/cli-$version/maestro.zip"
