name = "maestro"
version = "2.9.0"
description = "An open-source framework that makes UI and end-to-end testing for Android, iOS, and web apps simple and fast."
homepage = "https://maestro.dev"
license = "Apache-2.0"
kind = "app"
extract_dir = "maestro"
bin = ["bin\\maestro.bat"]

[source.x64]
url = "https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.9.0/maestro.zip"
sha256 = "855bb2ce1399d82f4f4a73d84a4d945f70b0d43eb86127e027af82809f63f0bd"

[env]
MAESTRO_HOME = "{dir}"

[autoupdate]
checkver = { github = "mobile-dev-inc/Maestro" }
url_template = "https://github.com/mobile-dev-inc/Maestro/releases/download/cli-$version/maestro.zip"
