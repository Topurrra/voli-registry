name = "mariadb"
version = "12.3.3"
description = "Community developed fork of MySQL server."
homepage = "https://mariadb.org"
license = "GPL-2.0-only"
kind = "app"
extract_dir = "mariadb-12.3.3-winx64"
bin = ["bin\\aria_chk.exe", "bin\\aria_dump_log.exe", "bin\\aria_ftdump.exe", "bin\\aria_pack.exe", "bin\\aria_read_log.exe", "bin\\innochecksum.exe", "bin\\myisamchk.exe", "bin\\myisamlog.exe", "bin\\myisampack.exe", "bin\\myisam_ftdump.exe", "bin\\mysql.exe", "bin\\mysqladmin.exe", "bin\\mysqlbinlog.exe", "bin\\mysqlcheck.exe", "bin\\mysqld.exe", "bin\\mysqldump.exe", "bin\\mysqlimport.exe", "bin\\mysqlshow.exe", "bin\\mysqlslap.exe", "bin\\mysql_install_db.exe", "bin\\mysql_plugin.exe", "bin\\mysql_tzinfo_to_sql.exe", "bin\\mysql_upgrade.exe", "bin\\mysql_upgrade_service.exe", "bin\\my_print_defaults.exe"]
persist = ["data"]

[source.x64]
url = "https://archive.mariadb.org/mariadb-12.3.3/winx64-packages/mariadb-12.3.3-winx64.zip"
sha256 = "4b5706b47148b47c8f36963c8352d1ddee37a1287b4690428f631a74b09b85a0"

[autoupdate]
checkver = { url = "https://downloads.mariadb.org/rest-api/mariadb/all-releases/", regex = "([\\d.]+)" }
url_template = { x64 = "https://archive.mariadb.org/mariadb-$version/winx64-packages/mariadb-$version-winx64.zip" }
