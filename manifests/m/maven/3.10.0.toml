name = "maven"
version = "3.10.0"
description = "Software project management and comprehension tool"
homepage = "https://maven.apache.org/"
license = "Apache-2.0"
kind = "app"
extract_dir = "apache-maven-3.10.0"
persist = ["conf", "lib\\ext"]

[source.x64]
url = "https://dlcdn.apache.org/maven/maven-3/3.10.0/binaries/apache-maven-3.10.0-bin.zip"
sha512 = "22d31676d5b92ed53308c19ecded3245d0efd0cddfec51ec7bab62f4f13ad70ddddceff8e62940e0e8e2421f3cde8106737f4becec0aa034ffeff2a754e88337"

[env]
PATH = "{dir}\\bin"

[autoupdate]
checkver = { url = "https://maven.apache.org/docs/history.html", regex = "<b>([\\d.]+)</b>" }
url_template = "https://dlcdn.apache.org/maven/maven-$majorVersion/$version/binaries/apache-maven-$version-bin.zip"
