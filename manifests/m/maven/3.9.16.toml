name = "maven"
version = "3.9.16"
description = "Software project management and comprehension tool"
homepage = "https://maven.apache.org/"
license = "Apache-2.0"
kind = "app"
extract_dir = "apache-maven-3.9.16"
persist = ["conf", "lib\\ext"]

[source.x64]
url = "https://dlcdn.apache.org/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.zip"
sha512 = "ed41650d42485cfc243fad22158caf9cbb5dc408ce7a09ddb94dd42a019de929ca43065bfa450612cf12bf78b5cafa3884b96c090de326ff590448c933454af3"

[env]
PATH = "{dir}\\bin"

[autoupdate]
checkver = { url = "https://maven.apache.org/docs/history.html", regex = "<b>([\\d.]+)</b>" }
url_template = "https://dlcdn.apache.org/maven/maven-$majorVersion/$version/binaries/apache-maven-$version-bin.zip"
