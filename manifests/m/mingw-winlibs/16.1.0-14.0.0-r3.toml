name = "mingw-winlibs"
version = "16.1.0-14.0.0-r3"
description = "GNU Compiler Collection (WinLibs build)"
homepage = "https://winlibs.com"
license = "GPL-3.0-or-later,ZPL-2.1,BSD-2-Clause,..."
kind = "app"
extract_dir = "mingw64"

[source.x64]
url = "https://github.com/brechtsanders/winlibs_mingw/releases/download/16.1.0posix-14.0.0-ucrt-r3/winlibs-x86_64-posix-seh-gcc-16.1.0-mingw-w64ucrt-14.0.0-r3.7z"
sha256 = "69445c900db5237656bef65b41cc28123c7203e8ae17d69a284c4c2c841220f2"

[env]
PATH = "{dir}\\bin"

[autoupdate]
checkver = "{\"regex\":\"(?<gcc>[\\\\d.]+)posix(?<llvm>-[\\\\d.]+)?-(?<mingw>[\\\\d.]+)-ucrt-r(?<release>\\\\d+)\",\"replace\":\"${gcc}-${mingw}-r${release}\"}"
