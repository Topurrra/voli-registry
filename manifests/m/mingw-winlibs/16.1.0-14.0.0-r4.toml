name = "mingw-winlibs"
version = "16.1.0-14.0.0-r4"
description = "GNU Compiler Collection (WinLibs build)"
homepage = "https://winlibs.com"
license = "GPL-3.0-or-later,ZPL-2.1,BSD-2-Clause,..."
kind = "app"
extract_dir = "mingw64"

[source.x64]
url = "https://github.com/brechtsanders/winlibs_mingw/releases/download/16.1.0posix-14.0.0-ucrt-r4/winlibs-x86_64-posix-seh-gcc-16.1.0-mingw-w64ucrt-14.0.0-r4.7z"
sha256 = "08b46777f127b92f4ca9ca057b317331178133d028513d1c3632f9cdcfde9ae7"

[env]
PATH = "{dir}\\bin"

[autoupdate]
checkver = "{\"regex\":\"(?<gcc>[\\\\d.]+)posix(?<llvm>-[\\\\d.]+)?-(?<mingw>[\\\\d.]+)-ucrt-r(?<release>\\\\d+)\",\"replace\":\"${gcc}-${mingw}-r${release}\"}"
