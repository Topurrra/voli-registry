name = "mosquitto"
version = "2.1.2"
description = "An open-source message broker that implements the MQTT protocol."
homepage = "https://mosquitto.org/"
license = "EPL-1.0"
kind = "app"
bin = ["mosquitto.exe", "mosquitto_passwd.exe", "mosquitto_pub.exe", "mosquitto_rr.exe", "mosquitto_sub.exe"]
persist = ["mosquitto.conf"]

[source.x64]
url = "https://mosquitto.org/files/binary/win64/mosquitto-2.1.2-install-windows-x64.exe#dl.7z"
sha256 = "58008ad7a22ada0b4073afa415801746e027c5f583e4fa52d0f4e9193b98d6aa"

[autoupdate]
checkver = { url = "https://mosquitto.org/download/", regex = "mosquitto-([\\d.a-z]+)-install-windows" }
url_template = { x64 = "https://mosquitto.org/files/binary/win64/mosquitto-$version-install-windows-x64.exe#dl.7z" }
