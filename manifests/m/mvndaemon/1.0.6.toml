name = "mvndaemon"
version = "1.0.6"
description = "The Maven (mvn) Daemon is based on GraalVM and allows for faster Maven builds."
homepage = "https://github.com/mvndaemon/mvnd"
license = "Apache-2.0"
kind = "app"
extract_dir = "maven-mvnd-1.0.6-windows-amd64"

[source.x64]
url = "https://dist.apache.org/repos/dist/release/maven/mvnd/1.0.6/maven-mvnd-1.0.6-windows-amd64.zip"
sha256 = "caba9e00736b8c0c62b9238ee75bc64294a0df42e45ecd513fee1914da3fd6cf"

[env]
PATH = "{dir}\\bin"

[autoupdate]
checkver = { github = "mvndaemon/mvnd" }
url_template = { x64 = "https://dist.apache.org/repos/dist/release/maven/mvnd/$version/maven-mvnd-$version-windows-amd64.zip" }
