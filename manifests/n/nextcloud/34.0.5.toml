name = "nextcloud"
version = "34.0.5"
description = "Desktop sync client for Nextcloud, a self-hosted productivity platform"
homepage = "https://nextcloud.com/"
license = "GPL-2.0-or-later"
kind = "app"
extract_dir = "PFiles\\Nextcloud"
bin = ["nextcloudcmd.exe", { name = "nextcloud", path = "nextcloudcmd.exe" }]
shortcuts = [{ target = "nextcloud.exe", name = "Nextcloud" }]

[source.x64]
url = "https://github.com/nextcloud-releases/desktop/releases/download/v34.0.5/Nextcloud-34.0.5-x64.msi"
sha256 = "ad048c193f9bbb577dc8b7bfde2f3f0a3be845bcd1585105ce62be0af4ab57ce"
kind = "installer-archive"

[autoupdate]
checkver = { url = "https://nextcloud.com/install/", regex = "Nextcloud-([\\d.]+)-x64.msi" }
url_template = { x64 = "https://github.com/nextcloud-releases/desktop/releases/download/v$version/Nextcloud-$version-x64.msi" }
