name = "nginx"
version = "1.31.4"
description = "An HTTP and reverse proxy server, a mail proxy server, and a generic TCP/UDP proxy server."
homepage = "https://nginx.org"
license = "BSD-2-Clause"
kind = "app"
extract_dir = "nginx-1.31.4"
bin = ["nginx.exe"]
persist = ["conf", "html", "logs", "temp"]

[source.x64]
url = "https://nginx.org/download/nginx-1.31.4.zip"
sha256 = "9217d06a62a357784bc7fee6740ccec985661e8caa511444911350f04668e16a"

[env]
NGINX_HOME = "{dir}"

[autoupdate]
checkver = { url = "https://nginx.org/en/CHANGES", regex = "Changes with nginx ([\\d.]+)" }
url_template = "https://nginx.org/download/nginx-$version.zip"
