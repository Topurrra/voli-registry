[source.arm64]
url = "https://nodejs.org/dist/v26.10.0/node-v26.10.0-win-arm64.7z"
sha256 = "9be039805e8eb2ba0e55857974638a922af5fd1707ade2c500a2feb75cbe295b"
extract_dir = "node-v26.10.0-win-arm64"

[env]
PATH = "{dir}\\bin;{dir}"

[autoupdate]
checkver = { url = "https://nodejs.org/dist/index.json", regex = "v([\\d.]+)" }
