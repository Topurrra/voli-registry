name = "nodejs"
version = "26.10.0"
description = "An asynchronous event driven JavaScript runtime designed to build scalable network applications."
homepage = "https://nodejs.org"
license = "MIT"
kind = "app"
persist = ["bin", "cache"]

[source.x64]
url = "https://nodejs.org/dist/v26.10.0/node-v26.10.0-win-x64.7z"
sha256 = "16ca2cfc9a311760bdbd9bf20fef3232d6dc3c8fcd3d55e221f9c200bf95306f"
