[source.arm64]
url = "https://nodejs.org/dist/v26.11.1/node-v26.11.1-win-arm64.7z"
sha256 = "b43b2118d28c9975df37772ea6c2dd1d67a05254c95d1cd576169dada8a9c855"
extract_dir = "node-v26.11.1-win-arm64"

[env]
PATH = "{dir}\\bin;{dir}"

[autoupdate]
checkver = { url = "https://nodejs.org/dist/index.json", regex = "v([\\d.]+)" }
url_template = { x64 = "https://nodejs.org/dist/v$version/node-v$version-win-x64.7z", arm64 = "https://nodejs.org/dist/v$version/node-v$version-win-arm64.7z" }
