name = "nodejs"
version = "26.11.1"
description = "An asynchronous event driven JavaScript runtime designed to build scalable network applications."
homepage = "https://nodejs.org"
license = "MIT"
kind = "app"
persist = ["bin", "cache"]

[source.x64]
url = "https://nodejs.org/dist/v26.11.1/node-v26.11.1-win-x64.7z"
sha256 = "4264e52430ee687e774a49725ec7c32040c830c1e1106de019fde4ed36d4c06b"
