[source.arm64]
url = "https://nodejs.org/dist/v26.5.0/node-v26.5.0-win-arm64.7z"
sha256 = "9245990322cc93b0dc4ecae502d3a3ad66086de2fd401315e31c40de3a4bdca7"
extract_dir = "node-v26.5.0-win-arm64"

[env]
PATH = "{dir}\\bin;{dir}"

[autoupdate]
checkver = { url = "https://nodejs.org/dist/index.json", regex = "v([\\d.]+)" }
url_template = { x64 = "https://nodejs.org/dist/v$version/node-v$version-win-x64.7z", arm64 = "https://nodejs.org/dist/v$version/node-v$version-win-arm64.7z" }
