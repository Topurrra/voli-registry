name = "nodejs"
version = "26.5.0"
description = "An asynchronous event driven JavaScript runtime designed to build scalable network applications."
homepage = "https://nodejs.org"
license = "MIT"
kind = "app"
persist = ["bin", "cache"]

[source.x64]
url = "https://nodejs.org/dist/v26.5.0/node-v26.5.0-win-x64.7z"
sha256 = "8385446010721c01b9959d554e365b0494ecc047a1f13cc8af219389ce102db3"
