name = "nrfutil"
version = "8.2.1"
description = "A unified command line utility for Nordic products."
homepage = "https://www.nordicsemi.com/Products/Development-tools/nRF-Util"
license = "LicenseRef-Nordic-1-Clause"
kind = "app"
extract_dir = "nrfutil-x86_64-pc-windows-msvc-8.2.1\\data"
bin = ["bin\\nrfutil.exe"]
persist = ["bin", "installed", "logs", "lib", "registry", "share"]

[source.x64]
url = "https://files.nordicsemi.com/artifactory/swtools/external/nrfutil/packages/nrfutil/nrfutil-x86_64-pc-windows-msvc-8.2.1.tar.gz"
sha256 = "701f1b0b7c3131c9f4df1e4de3aba6a311ece67656438a3c8a4a37cb7a2df147"

[env]
NRFUTIL_HOME = "{dir}"
PATH = "{dir}\\bin"

[autoupdate]
checkver = { url = "https://files.nordicsemi.com/artifactory/swtools/external/nrfutil/index/bootstrap.json", regex = "windows-msvc-([\\d.]+)\\.tar\\.gz" }
url_template = { x64 = "https://files.nordicsemi.com/artifactory/swtools/external/nrfutil/packages/nrfutil/nrfutil-x86_64-pc-windows-msvc-$version.tar.gz" }
