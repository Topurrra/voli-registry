name = "openjdk8-redhat"
version = "8u342-b07"
description = "Unaltered builds from the OpenJDK mercurial JDK8u code stream, built by Red Hat"
homepage = "https://adoptopenjdk.net/upstream.html"
license = "GPL-2.0-only WITH Classpath-exception-2.0"
kind = "app"

[source.x64]
url = "https://github.com/AdoptOpenJDK/openjdk8-upstream-binaries/releases/download/jdk8u342-b07/OpenJDK8U-jdk_x64_windows_8u342b07.zip"
sha256 = "d2a54d9da8e711e41737b3af8e1b576507cd1874536030c24c3dd96cd0dadef1"

[env]
JAVA_HOME = "{dir}"
PATH = "{dir}\\bin"

[autoupdate]
checkver = "{\"jp\":\"$..binaries[0].package.link\",\"re\":\"https://github.com/(?<url>.*?(?<tag>jdk(?<major>[\\\\d]+)(?<update>u[\\\\d]+)-(?<build>b[\\\\d]+)(?<patch>[\\\\d.]*)))/\",\"replace\":\"${major}${update}-${build}${patch}\",\"url\":\"https://api.adoptopenjdk.net/v3/assets/feature_releases/8/ga?jvm_impl=hotspot&heap_size=normal&os=windows&architecture=x64&image_type=jdk&project=jdk&vendor=openjdk&page_size=1&sort_order=DESC\"}"
