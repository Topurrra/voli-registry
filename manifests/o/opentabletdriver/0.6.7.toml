name = "opentabletdriver"
version = "0.6.7"
description = "Open source, cross-platform, user-mode tablet driver"
homepage = "https://opentabletdriver.net"
license = "LGPL-3.0"
kind = "app"
extract_dir = "OpenTabletDriver-0.6.7_win-x64"
bin = ["OpenTabletDriver.Console.exe", "OpenTabletDriver.Daemon.exe"]
shortcuts = [{ target = "OpenTabletDriver.UX.Wpf.exe", name = "OpenTabletDriver" }, { target = "OpenTabletDriver.Daemon.exe", name = "OpenTabletDriver Daemon" }]
persist = ["userdata"]

[source.x64]
url = "https://github.com/OpenTabletDriver/OpenTabletDriver/releases/download/v0.6.7/OpenTabletDriver-0.6.7_win-x64.zip"
sha256 = "4ee9ae149404f0b39132624e488507639c8ce56d1ec77755c66ee7e58562110a"

[autoupdate]
checkver = { github = "OpenTabletDriver/OpenTabletDriver" }
url_template = { x64 = "https://github.com/OpenTabletDriver/OpenTabletDriver/releases/download/v$version/OpenTabletDriver-$version_win-x64.zip" }
