name = "photocraft"
version = "0.7.0"
description = "Image editing; an open-source, clean-room reimplementation of Adobe Photoshop, rebuilt in pure Rust"
homepage = "https://getartcraft.com/apps/photocraft"
license = "MIT|Apache-2.0"
kind = "app"
bin = ["photocraft-cli.exe"]
shortcuts = [{ target = "photocraft.exe", name = "PhotoCraft" }]
persist = ["PhotoCraftData"]

[source.x64]
url = "https://github.com/storytold/photocraft/releases/download/v0.7.0/photocraft-0.7.0-windows-x64-portable.zip"
