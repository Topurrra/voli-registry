[source.arm64]
url = "https://github.com/storytold/photocraft/releases/download/v0.7.0/photocraft-0.7.0-windows-arm64-portable.zip"
sha256 = "776b6c89173ae32c73de206bea0879c0a6a58f5f1cf33bb61a11a06eeb2492b3"
extract_dir = "photocraft-0.7.0-windows-arm64-portable"

[autoupdate]
checkver = { github = "storytold/photocraft" }
url_template = { x64 = "https://github.com/storytold/photocraft/releases/download/v$version/photocraft-$version-windows-x64-portable.zip", arm64 = "https://github.com/storytold/photocraft/releases/download/v$version/photocraft-$version-windows-arm64-portable.zip" }
