name = "pkgconf"
version = "3.0.4"
description = "Package compiler and linker metadata toolkit."
homepage = "https://github.com/pkgconf/pkgconf"
license = "ISC"
kind = "app"
extract_dir = "PFiles64\\pkgconf 3.0.4"
bin = ["bomtool.exe", "pccritic.exe", "pkgconf.exe", "pkg-config.exe", "spdxtool.exe"]

[source.x64]
url = "https://github.com/pkgconf/pkgconf/releases/download/pkgconf-3.0.4/pkgconf-x64-3.0.4.msi"
