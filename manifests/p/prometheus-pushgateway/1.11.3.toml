name = "prometheus-pushgateway"
version = "1.11.3"
description = "Prometheus push acceptor for ephemeral and batch jobs."
homepage = "https://github.com/prometheus/pushgateway"
license = "Apache-2.0"
kind = "app"
bin = ["pushgateway.exe"]

[source.x64]
url = "https://github.com/prometheus/pushgateway/releases/download/v1.11.3/pushgateway-1.11.3.windows-amd64.tar.gz"
sha256 = "ba22eae5fe5434446cac98ee620accfdb392852583908919e5faa5860da9dc10"
extract_dir = "pushgateway-1.11.3.windows-amd64"

[source.arm64]
url = "https://github.com/prometheus/pushgateway/releases/download/v1.11.3/pushgateway-1.11.3.windows-arm64.tar.gz"
sha256 = "2531e97c220d3bb2199c6b52856ddbd5b5d028d368f902773e6bf60a5c3dbdc6"
extract_dir = "pushgateway-1.11.3.windows-arm64"

[autoupdate]
checkver = { github = "prometheus/pushgateway" }
url_template = { x64 = "https://github.com/prometheus/pushgateway/releases/download/v$version/pushgateway-$version.windows-amd64.tar.gz", arm64 = "https://github.com/prometheus/pushgateway/releases/download/v$version/pushgateway-$version.windows-arm64.tar.gz" }
