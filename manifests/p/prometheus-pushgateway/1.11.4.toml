name = "prometheus-pushgateway"
version = "1.11.4"
description = "Prometheus push acceptor for ephemeral and batch jobs."
homepage = "https://github.com/prometheus/pushgateway"
license = "Apache-2.0"
kind = "app"
bin = ["pushgateway.exe"]

[source.x64]
url = "https://github.com/prometheus/pushgateway/releases/download/v1.11.4/pushgateway-1.11.4.windows-amd64.tar.gz"
sha256 = "65760946d07b8df3e256f3e2b6e15295a90ad8dad95f2966d118a1ac7046d33e"
extract_dir = "pushgateway-1.11.4.windows-amd64"

[source.arm64]
url = "https://github.com/prometheus/pushgateway/releases/download/v1.11.4/pushgateway-1.11.4.windows-arm64.tar.gz"
sha256 = "df697271051cba4be9517930c0479c8f6fdd89ee87423dca3a1d147e65cbf96c"
extract_dir = "pushgateway-1.11.4.windows-arm64"

[autoupdate]
checkver = { github = "prometheus/pushgateway" }
url_template = { x64 = "https://github.com/prometheus/pushgateway/releases/download/v$version/pushgateway-$version.windows-amd64.tar.gz", arm64 = "https://github.com/prometheus/pushgateway/releases/download/v$version/pushgateway-$version.windows-arm64.tar.gz" }
