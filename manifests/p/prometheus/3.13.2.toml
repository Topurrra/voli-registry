name = "prometheus"
version = "3.13.2"
description = "Systems monitoring and alerting toolkit"
homepage = "https://prometheus.io"
license = "Apache-2.0"
kind = "app"
extract_dir = "prometheus-3.13.2.windows-amd64"
bin = [{ name = "prometheus", path = "prometheus.exe", args = "--config.file \"$persist_dir\\prometheus.yml\"" }, "promtool.exe"]
persist = ["data", "prometheus.yml"]

[source.x64]
url = "https://github.com/prometheus/prometheus/releases/download/v3.13.2/prometheus-3.13.2.windows-amd64.tar.gz"
sha256 = "ec54940b61af8342e0d413a4457d8b772fe6717cc9fa3abaeb83af81bc020184"

[autoupdate]
checkver = { github = "prometheus/prometheus" }
url_template = { x64 = "https://github.com/prometheus/prometheus/releases/download/v$version/prometheus-$version.windows-amd64.tar.gz" }
