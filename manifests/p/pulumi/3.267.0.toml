name = "pulumi"
version = "3.267.0"
description = "Create, deploy, and manage infrastructure on any cloud using any language."
homepage = "https://www.pulumi.com"
license = "Apache-2.0"
kind = "app"
extract_dir = "Pulumi\\bin"
bin = ["pulumi.exe", "pulumi-language-dotnet.exe", "pulumi-language-go.exe", "pulumi-language-java.exe", "pulumi-language-nodejs.exe", "pulumi-language-python-exec", "pulumi-language-python.exe", "pulumi-language-yaml.exe", "pulumi-resource-pulumi-nodejs.cmd", "pulumi-resource-pulumi-python.cmd", "pulumi-watch.exe"]

[source.x64]
url = "https://get.pulumi.com/releases/sdk/pulumi-v3.267.0-windows-x64.zip"
sha512 = "81a5d341efddc28959c174d1bd2c0f23310e9a47b10287d4d944e9f8f98b2e4f16f644418e4bbe34a60cc9e288462f7845c82a8bea6e27aa67c1996bc3d5b5d0"

[source.arm64]
url = "https://get.pulumi.com/releases/sdk/pulumi-v3.267.0-windows-x64.zip"
sha512 = "81a5d341efddc28959c174d1bd2c0f23310e9a47b10287d4d944e9f8f98b2e4f16f644418e4bbe34a60cc9e288462f7845c82a8bea6e27aa67c1996bc3d5b5d0"

[autoupdate]
checkver = { url = "https://www.pulumi.com/docs/get-started/install/versions", regex = "<strong>([\\d.]+)" }
url_template = { x64 = "https://get.pulumi.com/releases/sdk/pulumi-v$version-windows-x64.zip", arm64 = "https://get.pulumi.com/releases/sdk/pulumi-v$version-windows-x64.zip" }
