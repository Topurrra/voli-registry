name = "putty"
version = "0.85"
description = "A free implementation of SSH and Telnet, along with an xterm terminal emulator."
homepage = "https://www.chiark.greenend.org.uk/~sgtatham/putty/"
license = "MIT"
kind = "app"
bin = ["putty.exe", "puttygen.exe", "pscp.exe", "pageant.exe", "psftp.exe", "plink.exe"]
shortcuts = [{ target = "putty.exe", name = "PuTTY" }, { target = "pageant.exe", name = "Pageant (PuTTY authentication agent)" }, { target = "psftp.exe", name = "PSFTP" }, { target = "puttygen.exe", name = "PuTTYgen (PuTTY Key Generator)" }]

