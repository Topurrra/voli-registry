name = "pypy2"
version = "8.0.0"
description = "A fast, compliant alternative implementation of the Python language."
homepage = "https://www.pypy.org"
license = "MIT"
kind = "app"
extract_dir = "pypy2.7-v8.0.0-win64"
bin = ["pypy.exe", "pypyw.exe"]

[source.x64]
url = "https://downloads.python.org/pypy/pypy2.7-v8.0.0-win64.zip"
sha256 = "185abbe3186e44966a771adcb7f652e2d1710b52202ee38edc8577152216da43"

[autoupdate]
checkver = { url = "https://www.pypy.org/download.html", regex = "pypy(?<py>2[\\d.]+)-v([\\d.]+)" }
url_template = { x64 = "https://downloads.python.org/pypy/pypy$matchPy-v$version-win64.zip" }
