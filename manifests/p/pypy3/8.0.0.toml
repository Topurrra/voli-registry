[source.x64]
url = "https://downloads.python.org/pypy/pypy3.12-v8.0.0-win64.zip"
sha256 = "0ccfe530cf22330bd225c561bb41b6200a759d96a15847c541d4b98859adaf3f"

[autoupdate]
checkver = { url = "https://www.pypy.org/download.html", regex = "pypy(?<py>3[\\d.]+)-v([\\d.]+)" }
