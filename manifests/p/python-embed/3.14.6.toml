name = "python-embed"
version = "3.14.6"
description = "python.org's embeddable distribution: interpreter and standard library only, with no pip, no venv and no site-packages. For running Python code, not for installing packages."
homepage = "https://www.python.org/"
license = "PSF-2.0"
kind = "app"
bin = [{ name = "python-embed", path = "python.exe" }]

[source.x64]
url = "https://www.python.org/ftp/python/3.14.6/python-3.14.6-embed-amd64.zip"
sha256 = "df901e84a896ff1ee720ad03377e0c8d8c2244fda79808aeeaff6316df1cb75c"

[autoupdate]
checkver = { github = "python/cpython" }
url_template = { x64 = "https://www.python.org/ftp/python/$version/python-$version-embed-amd64.zip" }
