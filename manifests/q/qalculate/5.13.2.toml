name = "qalculate"
version = "5.13.2"
description = "Multi-purpose calculator"
homepage = "https://qalculate.github.io/"
license = "GPL-2.0-or-later"
kind = "app"
extract_dir = "qalculate"
bin = ["qalc.exe", "qalculate-gtk.exe", "qalculate-qt.exe"]
shortcuts = [{ target = "qalculate-gtk.exe", name = "Qalculate! (GTK)" }, { target = "qalculate-qt.exe", name = "Qalculate! (Qt)" }]
persist = ["user"]

[source.x64]
url = "https://github.com/Qalculate/libqalculate/releases/download/v5.13.2/qalculate-5.13.2-x64.zip"
sha256 = "6e8a39df926d6eae4e9139472b550a8e72a359888fd2f5ab6f060acc73fa677a"

[autoupdate]
checkver = { github = "Qalculate/libqalculate" }
url_template = { x64 = "https://github.com/Qalculate/libqalculate/releases/download/v$version/qalculate-$version-x64.zip" }
