name = "racket-minimal"
version = "9.2"
description = "Minimal Racket installation, without DrRacket/docs"
homepage = "https://racket-lang.org"
license = "LGPL-3.0-or-later"
kind = "app"
bin = ["racket.exe", "raco.exe"]

[source.x64]
url = "https://mirror.racket-lang.org/installers/9.2/racket-minimal-9.2-x86_64-win32.exe#/dl.7z"
