[source.arm64]
url = "https://mirror.racket-lang.org/installers/9.3/racket-minimal-9.3-arm64-win32.exe#/dl.7z"
sha256 = "38e86cb8597191d14fbfbbac35b457188a55318bdccb862a1ba3b7cc2a402e1d"

[autoupdate]
checkver = { url = "https://download.racket-lang.org/", regex = "Version ([\\d.]+)" }
