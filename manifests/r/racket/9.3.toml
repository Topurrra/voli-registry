name = "racket"
version = "9.3"
description = "A general-purpose, feature-rich programming language developed from Scheme Lisp, also the family of the core language and its dialects. It includes an extensive macro system for creating and implementing language constructs and dialects; eventspaces and custodians for resource management; units, modules and classes for programming in the large; paritial continuation; the first contract system for higher-order functions, and more."
homepage = "https://racket-lang.org"
license = "LGPL-3.0-or-later"
kind = "app"
bin = ["racket.exe", "raco.exe"]
shortcuts = [{ target = "GRacket.exe", name = "GRacket" }, { target = "DrRacket.exe", name = "DrRacket" }]

[source.x64]
url = "https://mirror.racket-lang.org/installers/9.3/racket-9.3-x86_64-win32.exe#/dl.7z"
sha256 = "8e3a788f4c30f4275182003aa980770fdf2548883738c8e96a08dfce4bd4afab"

[source.arm64]
url = "https://mirror.racket-lang.org/installers/9.3/racket-9.3-arm64-win32.exe#/dl.7z"
sha256 = "fcccd112afd3c8fecfdaf56d2a2fc3213fe006d8e4eac525ceaee56f10628a01"

[autoupdate]
checkver = { url = "https://download.racket-lang.org/", regex = "Version ([\\d.]+)" }
url_template = { x64 = "https://mirror.racket-lang.org/installers/$version/racket-$version-x86_64-win32.exe#/dl.7z", arm64 = "https://mirror.racket-lang.org/installers/$version/racket-$version-arm64-win32.exe#/dl.7z" }
