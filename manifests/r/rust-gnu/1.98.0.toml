name = "rust-gnu"
version = "1.98.0"
description = "A language empowering everyone to build reliable and efficient software. (GNU toolchain)"
homepage = "https://www.rust-lang.org"
license = "MIT|Apache-2.0"
kind = "app"
extract_dir = "Rust"
bin = ["bin\\rustc.exe", "bin\\rustdoc.exe", "bin\\cargo.exe"]

[source.x64]
url = "https://static.rust-lang.org/dist/rust-1.98.0-x86_64-pc-windows-gnu.msi"
sha256 = "53436f15940eeb59b656396b521f151fcca5127130ff74f88fcc7055d60c127d"
kind = "installer-archive"

[autoupdate]
checkver = { url = "https://www.rust-lang.org/", regex = "Version ([\\d.]+)" }
url_template = { x64 = "https://static.rust-lang.org/dist/rust-$version-x86_64-pc-windows-gnu.msi" }
