name = "rustic"
version = "0.11.4"
description = "fast, encrypted, and deduplicated backups powered by Rust"
homepage = "https://rustic.cli.rs"
license = "MIT|Apache-2.0"
kind = "app"
bin = ["rustic.exe"]
persist = ["config", "logs"]

[source.x64]
url = "https://github.com/rustic-rs/rustic/releases/download/v0.11.4/rustic-v0.11.4-x86_64-pc-windows-msvc.tar.gz"
sha256 = "aa3586c2646da30965e099393c739a32526c27314cfaaf97af7f65aab1ec230a"

[env]
RUSTIC_HOME = "{dir}"

[autoupdate]
checkver = { github = "rustic-rs/rustic" }
url_template = { x64 = "https://github.com/rustic-rs/rustic/releases/download/v$version/rustic-v$version-x86_64-pc-windows-msvc.tar.gz" }
