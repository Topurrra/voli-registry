name = "rustic"
version = "0.12.0"
description = "fast, encrypted, and deduplicated backups powered by Rust"
homepage = "https://rustic.cli.rs"
license = "MIT|Apache-2.0"
kind = "app"
bin = ["rustic.exe"]
persist = ["config", "logs"]

[source.x64]
url = "https://github.com/rustic-rs/rustic/releases/download/v0.12.0/rustic-v0.12.0-x86_64-pc-windows-msvc.tar.gz"
sha256 = "792bb1ecf32b9a01144f0316b5c1cb1e3e23fc20a8d9c2362e067d266e6ddfc9"

[env]
RUSTIC_HOME = "{dir}"

[autoupdate]
checkver = { github = "rustic-rs/rustic" }
url_template = { x64 = "https://github.com/rustic-rs/rustic/releases/download/v$version/rustic-v$version-x86_64-pc-windows-msvc.tar.gz" }
