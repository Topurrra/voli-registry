name = "sbt"
version = "2.0.7"
description = "A build tool for Scala, Java, and more"
homepage = "https://www.scala-sbt.org"
license = "BSD-3-Clause"
kind = "app"
extract_dir = "sbt"
bin = ["bin\\sbt.bat"]
persist = ["conf"]

[source.x64]
url = "https://github.com/sbt/sbt/releases/download/v2.0.7/sbt-2.0.7.zip"
sha256 = "0d87a6e0538a4da319e15991fd302fce16e14529c0fa720f0e24dad71a306883"

[env]
SBT_HOME = "{dir}"

[autoupdate]
checkver = { url = "https://www.scala-sbt.org/download/", regex = "/sbt-([\\d.]+)\\.zip" }
url_template = "https://github.com/sbt/sbt/releases/download/v$version/sbt-$version.zip"
