name = "scala"
version = "3.10.0"
description = "A modern multi-paradigm programming language designed to express common programming patterns in a concise, elegant, and type-safe way."
homepage = "https://www.scala-lang.org/"
license = "BSD-3-Clause"
kind = "app"
extract_dir = "PFiles\\Scala"
bin = ["bin\\scala.bat", "bin\\scalac.bat", "bin\\scaladoc.bat"]

[source.x64]
url = "https://github.com/scala/scala3/releases/download/3.10.0/scala3-3.10.0.msi"
sha256 = "4100309910f900308ef6b6cfbbd975d5169bc013ebd45a5ab43c7600c2dca821"
kind = "installer-archive"

[env]
SCALA_HOME = "{dir}"

[autoupdate]
checkver = { github = "scala/scala3" }
url_template = "https://github.com/scala/scala3/releases/download/$version/scala3-$version.msi"
