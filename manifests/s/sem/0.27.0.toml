name = "sem"
version = "0.27.0"
description = "A semantic version control tool that works on top of Git, using tree-sitter to diff code at the entity level (functions, classes, and methods) instead of by lines."
homepage = "https://ataraxy-labs.github.io/sem/"
license = "MIT|Apache-2.0"
kind = "app"
bin = ["sem.exe"]

[source.x64]
url = "https://github.com/Ataraxy-Labs/sem/releases/download/v0.27.0/sem-windows-x86_64.zip"
sha256 = "fc5aad509ad271090a169c165e0c5a2d20d046d218012b17a796268e2bccc7d0"

[autoupdate]
checkver = { github = "Ataraxy-Labs/sem" }
url_template = { x64 = "https://github.com/Ataraxy-Labs/sem/releases/download/v$version/sem-windows-x86_64.zip" }
