name = "sndcpy"
version = "1.1"
description = "Android audio forwarding (scrcpy, but for audio)"
homepage = "https://github.com/rom1v/sndcpy"
license = "MIT"
kind = "app"
bin = ["sndcpy.bat"]

[source.x64]
url = "https://github.com/rom1v/sndcpy/releases/download/v1.1/sndcpy-v1.1.zip"
sha256 = "b045320ddddbc5a237d6d95213c664f03b2f46ef8bbfcef91c2d95644ed42bbc"

[env]
SNDCPY_APK = "{dir}\\sndcpy.apk"
VLC = "vlc"

[depends]
adb = "*"
vlc = "*"

[autoupdate]
checkver = { github = "rom1v/sndcpy" }
url_template = "https://github.com/rom1v/sndcpy/releases/download/v$version/sndcpy-v$version.zip"
