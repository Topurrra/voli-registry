[source.arm64]
url = "https://github.com/sourcegit-scm/sourcegit/releases/download/v2026.16/sourcegit_2026.16.win-arm64.zip"
sha256 = "4661120b9edcc6159e555b1c8fdeb2f3a7336bb4e9abcda2f02061fa63613020"

[autoupdate]
checkver = { github = "sourcegit-scm/sourcegit" }
url_template = { x64 = "https://github.com/sourcegit-scm/sourcegit/releases/download/v$version/sourcegit_$version.win-x64.zip", arm64 = "https://github.com/sourcegit-scm/sourcegit/releases/download/v$version/sourcegit_$version.win-arm64.zip" }
