name = "spark"
version = "4.2.0"
description = "A unified analytics engine for large-scale data processing."
homepage = "https://spark.apache.org/"
license = "Apache-2.0"
kind = "app"
extract_dir = "spark-4.2.0-bin-hadoop3"
persist = ["conf"]

[source.x64]
url = "https://archive.apache.org/dist/spark/spark-4.2.0/spark-4.2.0-bin-hadoop3.tgz"
sha512 = "3a6559e8546ff387db8fe7a04b8fe4008853b467b972c2e343df8e14a81450534777719fc5d4998dd96519a86fdf9de140cee753c61e2e94db044d5f9555ddc4"

[env]
PATH = "{dir}\\bin"
SPARK_HOME = "{dir}"

[autoupdate]
checkver = { url = "https://spark.apache.org/js/downloads.js", regex = "addRelease\\(\"([\\d.]+)\"," }
url_template = "https://archive.apache.org/dist/spark/spark-$version/spark-$version-bin-hadoop3.tgz"
