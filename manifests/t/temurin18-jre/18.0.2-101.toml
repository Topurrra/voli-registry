name = "temurin18-jre"
version = "18.0.2-101"
description = "Eclipse Temurin is a runtime provided by Eclipse Adoptium for general use across the Java ecosystem"
homepage = "https://adoptium.net"
license = "GPL-2.0-only WITH Classpath-exception-2.0"
kind = "app"

[source.x64]
url = "https://github.com/adoptium/temurin18-binaries/releases/download/jdk-18.0.2.1+1/OpenJDK18U-jre_x64_windows_hotspot_18.0.2.1_1.zip"
sha256 = "ba7976e86e9a7e27542c7cf9d5081235e603a9be368b6cbd49673b417da544b1"

[env]
JAVA_HOME = "{dir}"
PATH = "{dir}\\bin"

[autoupdate]
checkver = "{\"regex\":\"(?<ver>.*?) https://github.com/(?<link>.*?)/tag/(?<tag>.*?) (?<name>(?<prefix>OpenJDK[\\\\dU]*-[dejkr]{3})_x64_(?<suffix>.*))\",\"replace\":\"${ver}\",\"script\":[\"$ver = (json_path $page $..version_data.semver).replace('+', '-')\",\"$link = (json_path $page $..release_link).replace('%2B', '+')\",\"$name = json_path $page $..binaries[0].package.name\",\"Write-Output \\\"$ver $link $name\\\"\"],\"url\":\"https://api.adoptium.net/v3/assets/feature_releases/18/ga?jvm_impl=hotspot&heap_size=normal&os=windows&architecture=x64&image_type=jre&project=jdk&vendor=eclipse&page_size=1&sort_order=DESC\"}"
