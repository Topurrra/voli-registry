name = "temurin21-jre"
version = "21.0.11-10.0"
description = "Eclipse Temurin is a runtime provided by Eclipse Adoptium for general use across the Java ecosystem"
homepage = "https://adoptium.net"
license = "GPL-2.0-only WITH Classpath-exception-2.0"
kind = "app"

[source.x64]
url = "https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.11+10/OpenJDK21U-jre_x64_windows_hotspot_21.0.11_10.zip"
sha256 = "be26677aaa20b39a62edcaab4c8857a8b76673b0f45abc0b6143b142b62717e4"

[env]
PATH = "{dir}\\bin"
JAVA_HOME = "{dir}"

[autoupdate]
checkver = "{\"regex\":\"(?<ver>.*?) https://github.com/(?<link>.*?)/tag/(?<tag>.*?) (?<name>(?<prefix>OpenJDK[\\\\dU]*-[dejkr]{3})_x64_(?<suffix>.*))\",\"replace\":\"${ver}\",\"script\":[\"$ver = (json_path $page $..version_data.semver).replace('+', '-').replace('.LTS', '')\",\"$link = (json_path $page $..release_link).replace('%2B', '+')\",\"$name = json_path $page $..binaries[0].package.name\",\"Write-Output \\\"$ver $link $name\\\"\"],\"url\":\"https://api.adoptium.net/v3/assets/feature_releases/21/ga?jvm_impl=hotspot&heap_size=normal&os=windows&architecture=x64&image_type=jre&project=jdk&vendor=eclipse&page_size=1&sort_order=DESC\"}"
