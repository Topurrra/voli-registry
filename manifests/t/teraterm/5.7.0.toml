name = "teraterm"
version = "5.7.0"
description = "Terminal emulator for ssh/telnet/serial connection."
homepage = "https://teratermproject.github.io/index-en.html"
license = "BSD-3-Clause"
kind = "app"
bin = ["ttermpro.exe"]
shortcuts = [{ target = "ttermpro.exe", name = "Tera Term" }]
persist = ["cygterm.cfg", "KEYBOARD.CNF", "ttpmenu.ini", "ssh_known_hosts", "TERATERM.INI"]

[source.x64]
url = "https://github.com/TeraTermProject/teraterm/releases/download/v5.7.0/teraterm-5.7.0-x64.zip"
sha256 = "81d7238fe352ea6adcdfd8aeef8d464c20b8137e9dbbb067aa8072a1938edbff"
extract_dir = "teraterm-5.7.0-x64"

[source.arm64]
url = "https://github.com/TeraTermProject/teraterm/releases/download/v5.7.0/teraterm-5.7.0-arm64.zip"
sha256 = "a6478447fa701f5fd39cbd739248d42e87669ec1e3c056106796923d4fe6caf1"
extract_dir = "teraterm-5.7.0-arm64"

[autoupdate]
checkver = { github = "TeraTermProject/teraterm" }
url_template = { x64 = "https://github.com/TeraTermProject/teraterm/releases/download/v$version/teraterm-$version-x64.zip", arm64 = "https://github.com/TeraTermProject/teraterm/releases/download/v$version/teraterm-$version-arm64.zip" }
