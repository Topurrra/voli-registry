name = "tinymediamanager"
version = "4.3.16"
description = "tinyMediaManager is a media management tool written in Java/Swing. It is written to provide metadata for the Kodi Media Center (formerly known as XBMC), MediaPortal and Plex media server"
homepage = "https://www.tinymediamanager.org/"
license = "Apache-2.0"
kind = "app"
bin = ["tinyMediaManagerCMD.exe"]
shortcuts = [{ target = "tinyMediaManager.exe", name = "tinyMediaManager" }]
persist = ["logs", "data", "cache", "backup"]

[source.x64]
url = "https://release.tinymediamanager.org/v4/dist/tmm_4.3.16_windows-amd64.zip"
sha256 = "944459e16d1d364cdb0d7545d610d26cb258eee4fe00add00e42da64fac168cd"

[autoupdate]
checkver = { url = "https://release.tinymediamanager.org/", regex = "tmm_([\\d\\.]+)_windows-amd64\\.zip" }
url_template = { x64 = "https://release.tinymediamanager.org/v4/dist/tmm_$version_windows-amd64.zip" }
