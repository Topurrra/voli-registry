name = "tomcat"
version = "11.0.24"
description = "Implementation of the Java Servlet, JavaServer Pages, Java Expression Language and Java WebSocket technologies"
homepage = "https://tomcat.apache.org"
license = "Apache-2.0"
kind = "app"
extract_dir = "apache-tomcat-11.0.24"
bin = ["bin\\catalina.bat"]
persist = ["conf", "webapps"]

[source.x64]
url = "https://archive.apache.org/dist/tomcat/tomcat-11/v11.0.24/bin/apache-tomcat-11.0.24-windows-x64.zip"
sha512 = "bdff4dc163441fdbfbab7a0504d374dc25079497959829f3d94fada11fafaae55e56a577240b961711f583e31a1f8aa993b0675d768581ee87d3aa09d17761e9"

[env]
CATALINA_BASE = "{dir}"
CATALINA_HOME = "{dir}"

[autoupdate]
checkver = { url = "https://archive.apache.org/dist/tomcat/tomcat-11/?C=M;O=D", regex = "v([\\d.]+)/" }
url_template = { x64 = "https://archive.apache.org/dist/tomcat/tomcat-$majorVersion/v$version/bin/apache-tomcat-$version-windows-x64.zip" }
