sha256 = "9f409dae8d9e2f66ef8040bb606164166150feb3cb7521aa71aee0222d14d557"

[autoupdate]
checkver = { github = "twilio/twilio-cli" }
url_template = { x64 = "https://twilio-cli-prod.s3.amazonaws.com/twilio-v$version/twilio-v$version-win32-x64.tar.xz" }
