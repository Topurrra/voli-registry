name = "typespec"
version = "1.17.0"
description = "Compiler CLI for TypeSpec, a language for defining cloud service APIs and shapes."
homepage = "https://typespec.io"
license = "MIT"
kind = "app"
bin = ["tsp.exe"]

[source.x64]
url = "https://typespec.blob.core.windows.net/dist/1.17.0/tsp-windows-x64.zip"
