name = "vfox"
version = "1.0.12"
description = "Manage multiple SDK versions with a single CLI tool, extendable via plugins"
homepage = "https://vfox.dev/"
license = "Apache-2.0"
kind = "app"
bin = ["vfox.exe"]

[source.x64]
url = "https://github.com/version-fox/vfox/releases/download/v1.0.12/vfox_1.0.12_windows_x86_64.zip"
sha256 = "0dd8285f636419a538a65b1a2bb7242e6fac5f50d9fdf3b479f517610846110e"
extract_dir = "vfox_1.0.12_windows_x86_64"

[source.arm64]
url = "https://github.com/version-fox/vfox/releases/download/v1.0.12/vfox_1.0.12_windows_aarch64.zip"
sha256 = "28d552f21c76f6a6c094d4ff1a8bc3dd1b7a256f168c7d33f4514390e336f9c3"
extract_dir = "vfox_1.0.12_windows_aarch64"

[autoupdate]
checkver = { github = "version-fox/vfox" }
url_template = { x64 = "https://github.com/version-fox/vfox/releases/download/v$version/vfox_$version_windows_x86_64.zip", arm64 = "https://github.com/version-fox/vfox/releases/download/v$version/vfox_$version_windows_aarch64.zip" }
