name = "wasmer"
version = "7.2.1"
description = "The leading WebAssembly Runtime supporting WASI and Emscripten"
homepage = "https://wasmer.io/"
license = "MIT"
kind = "app"
bin = ["bin\\wasmer.exe"]

[source.x64]
url = "https://github.com/wasmerio/wasmer/releases/download/v7.2.1/wasmer-windows-amd64.tar.gz"
sha256 = "3d708642cfdc9458eccbf51dcbb2e61a9d247bb1c9cb637341849b136a6e70bb"

[env]
WASMER_CACHE_DIR = "{dir}\\cache"
WASMER_DIR = "{dir}"

[autoupdate]
checkver = { github = "wasmerio/wasmer" }
