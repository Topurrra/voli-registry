name = "wasmer"
version = "7.4.2"
description = "The leading WebAssembly Runtime supporting WASI and Emscripten"
homepage = "https://wasmer.io/"
license = "MIT"
kind = "app"
bin = ["bin\\wasmer.exe"]

[source.x64]
url = "https://github.com/wasmerio/wasmer/releases/download/v7.4.2/wasmer-windows-amd64.tar.gz"
sha256 = "af6a00bf35296025b46914b2507a740414ead89131733af4e0e929cd981d8c90"

[env]
WASMER_CACHE_DIR = "{dir}\\cache"
WASMER_DIR = "{dir}"

[autoupdate]
checkver = { github = "wasmerio/wasmer" }
url_template = { x64 = "https://github.com/wasmerio/wasmer/releases/download/v$version/wasmer-windows-amd64.tar.gz" }
