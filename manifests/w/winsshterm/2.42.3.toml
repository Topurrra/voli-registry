name = "winsshterm"
version = "2.42.3"
description = "A tabbed SSH solution for Windows, combining PuTTY, WinSCP and VcXsrv"
homepage = "https://winsshterm.blogspot.com/"
license = "Freeware"
kind = "app"
extract_dir = "WinSSHTerm"
bin = ["WinSSHTerm.exe"]
shortcuts = [{ target = "WinSSHTerm.exe", name = "WinSSHTerm" }]
persist = ["config", "tools"]

[source.x64]
url = "https://github.com/WinSSHTerm/WinSSHTerm/releases/download/2.42.3/WinSSHTerm-2.42.3-x64.zip"
sha256 = "859d0afb2aa34a45a08e733c8a8614b02f5fae9085813dc6b67450703a8cc739"

[source.arm64]
url = "https://github.com/WinSSHTerm/WinSSHTerm/releases/download/2.42.3/WinSSHTerm-2.42.3-arm64.zip"
sha256 = "e3faaa0fb20b29375d1afc34a3b90f8e83ccfceefde1d47d007548c483eb099a"

[env]
WINSSHTERM_EXE_DISALLOW_AUTO_UPDATE = "TRUE"

[depends]
putty = "*"

[autoupdate]
checkver = { github = "WinSSHTerm/WinSSHTerm" }
url_template = { x64 = "https://github.com/WinSSHTerm/WinSSHTerm/releases/download/$version/WinSSHTerm-$version-x64.zip", arm64 = "https://github.com/WinSSHTerm/WinSSHTerm/releases/download/$version/WinSSHTerm-$version-arm64.zip" }
