name = "wsl-terminal"
version = "0.9.2"
description = "Terminal emulator for Windows Subsystem for Linux (WSL)"
homepage = "https://github.com/goreliu/wsl-terminal"
license = "MIT"
kind = "app"
extract_dir = "wsl-terminal"
bin = [{ name = "wsl-terminal", path = "open-wsl.exe" }, "open-wsl.exe", "run-wsl-file.exe", { name = "wsl-vim", path = "vim.exe" }]
shortcuts = [{ target = "open-wsl.exe", name = "wsl-terminal" }]
persist = ["etc\\wsl-terminal.conf", "etc\\minttyrc", "etc\\themes"]

[source.x64]
url = "https://github.com/goreliu/wsl-terminal/releases/download/v0.9.2/wsl-terminal-0.9.2.7z"
sha256 = "55233b0cd44db4b392ca6bb21ffaedc8635b588d54a7eb1c266ec1c88d5f9eb6"

[autoupdate]
checkver = { github = "goreliu/wsl-terminal" }
url_template = "https://github.com/goreliu/wsl-terminal/releases/download/v$version/wsl-terminal-$version.7z"
