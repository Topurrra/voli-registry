name = "yarr"
version = "2.8"
description = "Yet Another RSS Reader, a web-based feed aggregator"
homepage = "https://github.com/nkanaev/yarr"
license = "MIT"
kind = "app"
bin = ["yarr.exe"]
persist = ["data"]

[source.x64]
url = "https://github.com/nkanaev/yarr/releases/download/v2.8/yarr_windows_amd64_gui.zip"
sha256 = "893a66b78278a62167473cc0d9a11394710ad0298347def339d9f75238a75a56"

[env]
YARR_DB = "{dir}\\data\\storage.db"
YARR_LOGFILE = "{dir}\\data\\yarr.log"

[autoupdate]
checkver = { github = "nkanaev/yarr" }
