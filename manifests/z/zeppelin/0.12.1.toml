name = "zeppelin"
version = "0.12.1"
description = "Web-based notebook that enables data-driven, interactive data analytics and collaborative documents with SQL, Scala and more."
homepage = "https://zeppelin.apache.org/"
license = "Apache-2.0"
kind = "app"
extract_dir = "zeppelin-0.12.1-bin-all"
persist = ["conf", "notebook"]

[source.x64]
url = "https://www.apache.org/dist/zeppelin/zeppelin-0.12.1/zeppelin-0.12.1-bin-all.tgz#/zeppelin.tar.gz"
sha512 = "026505894534903fb9042bc86eb94fe9ec25a70745533d8cc59ed9963a249eca11443f6295dfa37e00579283d9b55c7ed10912dee255b68d474ceb40c2184938"

[env]
PATH = "{dir}\\bin"

[autoupdate]
checkver = "{\"regex\":\"zeppelin-([\\\\d.]+)-bin-all\\\\.tgz\",\"url\":\"https://zeppelin.apache.org/download.html\"}"
