name = "zookeeper"
version = "3.9.5"
description = "High-performance coordination service for distributed applications"
homepage = "https://zookeeper.apache.org/"
license = "Apache-2.0"
kind = "app"
extract_dir = "apache-zookeeper-3.9.5-bin"
bin = ["bin\\zkServer.cmd", "bin\\zkCli.cmd"]
persist = ["data"]

[source.x64]
url = "https://downloads.apache.org/zookeeper/zookeeper-3.9.5/apache-zookeeper-3.9.5-bin.tar.gz"
sha512 = "baa1c21dda4d57238fca751e4fa2bbf1daff9a28612b125e497dccd5c188ee6449e2f79947e474c2dd4d19992789d4d36b27b1ba2feb80c2b0c45e7df0e22aa8"

[autoupdate]
checkver = { url = "https://downloads.apache.org/zookeeper/", regex = "zookeeper-([\\d.]+)/" }
url_template = "https://downloads.apache.org/zookeeper/zookeeper-$version/apache-zookeeper-$version-bin.tar.gz"
