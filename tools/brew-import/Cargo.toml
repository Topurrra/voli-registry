# Standalone importer — deliberately NOT part of any workspace.
[workspace]

[package]
name = "brew-import"
version = "0.1.0"
edition = "2024"

[dependencies]
# Path dep on voli-core for Manifest types, the canonical serializer and the
# round-trip check. Relative from voli-registry/tools/brew-import → voli/crates/voli-core.
voli-core = { path = "../../../voli/crates/voli-core" }
serde_json = "1"
# Same 0.8 line voli-core uses (the allowlist is TOML, like everything else here).
toml = "0.8"
thiserror = "2"
ureq = { version = "2", default-features = false, features = ["tls"] }
sha2 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
tempfile = "3"
