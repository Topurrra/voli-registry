# ---------------------------------------------------------------------------
# Batch 2: unix sources for CLI tools already carried as Windows-only manifests.
# Asset names below were each verified against the pinned release and the
# payload's bin path checked against the manifest's `bin` (voli strips a
# trailing `.exe` when resolving on unix, so one `bin = ["rg.exe"]` serves
# both). pandoc and fastfetch keep their binary below the archive root, so
# their assets pin `extract_dir` explicitly instead of relying on detection.
#
# NOT here on purpose: jq (tag is `jq-<version>`) and gping (tag is `gping-v<version>`).
# brew-import derives the manifest version as strip_v(tag), which those two
# tag schemes would resolve to a non-version string. Their unix sources are
# pinned directly in the manifests; bump them by hand.
# ---------------------------------------------------------------------------

