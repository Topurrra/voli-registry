# brew-import allowlist: upstream GitHub releases that become voli unix sources.
#
# Each entry names a repo, the release asset per unix platform, and the bins.
# `{version}` is the tag with a leading `v` stripped (`v10.5.0` → `10.5.0`);
# `{tag}` is the raw tag. Asset names must match EXACTLY (verified against the
# release; a miss fails loudly with the candidate list).
#
# Linux assets should be musl-static where upstream ships them (runs on any
# distro, any glibc); the linkage gate rejects anything needing a
# package-manager prefix, and the smoke gate executes every binary the host
# can run. macOS assets are hash-verified here and executed by `--verify-only`
# on a Mac (CI macos leg).
#
# description/homepage/license are only used for brand-new version files;
# merges into existing manifests keep the registry's own metadata and Windows
# blocks untouched.
#
# Discovery aid: https://formulae.brew.sh/api/formula/<name>.json carries the
# version, SPDX license, and `executables` list per formula. Payloads NEVER
# come from bottles (their INTERP is @@HOMEBREW_PREFIX@@/lib/ld.so — the
# kernel refuses to exec them without Homebrew).

