license = "EUPL-1.2"
bin = ["eza"]

# NOTE: upstream ships no macOS tarballs and no versioned filenames here;
# eza is Linux-only until that changes (exact names, no placeholders needed).
[source.assets.linux-x64]
file = "eza_x86_64-unknown-linux-musl.tar.gz"

# NOTE: glibc-dynamic (no musl arm64 published); accepted because it smokes,
# but musl stays preferred wherever upstream offers it.
[source.assets.linux-arm64]
file = "eza_aarch64-unknown-linux-gnu.tar.gz"

